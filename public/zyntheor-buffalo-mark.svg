<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ZYNTHEOR Buffalo Edition Mark">
  <defs>
    <linearGradient id="horn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Minimal geometric buffalo head / mark -->
  <!-- Left horn (angular) -->
  <path d="M18 22 L8 8 L14 10 L22 20 Z" fill="url(#horn)" opacity="0.95"/>
  <!-- Right horn (angular) -->
  <path d="M46 22 L56 8 L50 10 L42 20 Z" fill="url(#horn)" opacity="0.95"/>

  <!-- Head shape - geometric shield / hex-inspired -->
  <path d="M20 24 
           L32 18 
           L44 24 
           L46 38 
           L32 48 
           L18 38 Z" 
        fill="url(#body)" stroke="#134E4A" stroke-width="1.2"/>

  <!-- Inner face plane -->
  <path d="M24 28 
           L32 24 
           L40 28 
           L41 36 
           L32 42 
           L23 36 Z" 
        fill="#0A1624" opacity="0.55"/>

  <!-- Eye dots (minimal) -->
  <circle cx="27" cy="32" r="1.8" fill="#5EEAD4"/>
  <circle cx="37" cy="32" r="1.8" fill="#5EEAD4"/>

  <!-- Subtle cyan accent line under horns -->
  <path d="M16 23 Q32 19 48 23" fill="none" stroke="#22D3EE" stroke-width="1.1" opacity="0.6" filter="url(#soft)"/>
</svg>

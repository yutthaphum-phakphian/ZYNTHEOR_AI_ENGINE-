<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="ZYNTHEOR Buffalo Edition Mark">
  <defs>
    <linearGradient id="horn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="0.5" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="plate" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#0F2A3F"/>
      <stop offset="1" stop-color="#07111E"/>
    </radialGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-6" y="-6" width="108" height="108">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    @keyframes mk-run  { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    @keyframes mk-runr { from { stroke-dashoffset: 0; }   to { stroke-dashoffset: 100; } }
    @keyframes mk-eye  { 0%,92%,100% { transform: scaleY(1); } 96% { transform: scaleY(0.15); } }
    @keyframes mk-halo { 0%,100% { opacity: .35; } 50% { opacity: .7; } }
    .mk-run  { stroke-dasharray: 16 84; animation: mk-run 4.4s linear infinite; }
    .mk-runr { stroke-dasharray: 10 90; animation: mk-runr 6.2s linear infinite; }
    .mk-eye  { transform-box: fill-box; transform-origin: center; animation: mk-eye 5s ease-in-out infinite; }
    .mk-halo { animation: mk-halo 3s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .mk-run, .mk-runr, .mk-eye, .mk-halo { animation: none; }
    }
  </style>

  <!-- soft halo behind the frame -->
  <path class="mk-halo" d="M 48 4 L 86.1 26 L 86.1 70 L 48 92 L 9.9 70 L 9.9 26 Z" fill="none" stroke="#2DD4BF" stroke-width="5" stroke-linejoin="round" opacity="0.4" filter="url(#glow)"/>

  <!-- hexagon plate + static rim -->
  <path d="M 48 4 L 86.1 26 L 86.1 70 L 48 92 L 9.9 70 L 9.9 26 Z" fill="url(#plate)" stroke="#16405C" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M 48 10 L 80.9 29 L 80.9 67 L 48 86 L 15.1 67 L 15.1 29 Z" fill="none" stroke="#1B4A6B" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.8"/>

  <!-- buffalo head (original mark geometry, centered) -->
  <g transform="translate(48 49) scale(1.08) translate(-32 -28)">
    <path d="M18 22 L8 8 L14 10 L22 20 Z" fill="url(#horn)" opacity="0.95"/>
    <path d="M46 22 L56 8 L50 10 L42 20 Z" fill="url(#horn)" opacity="0.95"/>
    <path d="M20 24 L32 18 L44 24 L46 38 L32 48 L18 38 Z" fill="url(#body)" stroke="#134E4A" stroke-width="1.2"/>
    <path d="M24 28 L32 24 L40 28 L41 36 L32 42 L23 36 Z" fill="#0A1624" opacity="0.55"/>
    <circle class="mk-eye" cx="27" cy="32" r="1.8" fill="#5EEAD4"/>
    <circle class="mk-eye" cx="37" cy="32" r="1.8" fill="#5EEAD4"/>
    <path d="M16 23 Q32 19 48 23" fill="none" stroke="#22D3EE" stroke-width="1.1" opacity="0.6" filter="url(#soft)"/>
  </g>

  <!-- running lasers along the hexagon frame -->
  <path class="mk-run"  d="M 48 4 L 86.1 26 L 86.1 70 L 48 92 L 9.9 70 L 9.9 26 Z" pathLength="100" fill="none" stroke="url(#ring)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path class="mk-runr" d="M 48 4 L 86.1 26 L 86.1 70 L 48 92 L 9.9 70 L 9.9 26 Z" pathLength="100" fill="none" stroke="#E6FFFA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>

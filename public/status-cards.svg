<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 120" width="840" height="120" role="img" aria-labelledby="t d" font-family="'Segoe UI',Arial,sans-serif">
  <title id="t">Local check status</title>
  <desc id="d">TESTS: UNVERIFIED; TYPE ERRORS: UNVERIFIED; BUILD: UNVERIFIED; MANIFEST: UNVERIFIED. Not run yet - every value is UNVERIFIED until scripts/gen-status-cards.mjs is executed</desc>
  <style>
    .dot{animation:p 2.4s ease-in-out infinite}
    @keyframes p{50%{opacity:.35}}
    @media (prefers-reduced-motion:reduce){.dot{animation:none}}
  </style>
  <g transform="translate(0 0)">
    <rect x="1" y="1" width="193" height="86" rx="14" fill="#0D1828" stroke="#94A3B8" stroke-opacity=".55" stroke-width="1.5"/>
    <circle class="dot" cx="20" cy="22" r="4.5" fill="#94A3B8"/>
    <text x="32" y="26" font-size="12" letter-spacing="2" fill="#94A3B8">TESTS</text>
    <text x="97" y="63" text-anchor="middle" font-size="19" font-weight="700" fill="#94A3B8">UNVERIFIED</text>
  </g>
  <g transform="translate(215 0)">
    <rect x="1" y="1" width="193" height="86" rx="14" fill="#0D1828" stroke="#94A3B8" stroke-opacity=".55" stroke-width="1.5"/>
    <circle class="dot" cx="20" cy="22" r="4.5" fill="#94A3B8"/>
    <text x="32" y="26" font-size="12" letter-spacing="2" fill="#94A3B8">TYPE ERRORS</text>
    <text x="97" y="63" text-anchor="middle" font-size="19" font-weight="700" fill="#94A3B8">UNVERIFIED</text>
  </g>
  <g transform="translate(430 0)">
    <rect x="1" y="1" width="193" height="86" rx="14" fill="#0D1828" stroke="#94A3B8" stroke-opacity=".55" stroke-width="1.5"/>
    <circle class="dot" cx="20" cy="22" r="4.5" fill="#94A3B8"/>
    <text x="32" y="26" font-size="12" letter-spacing="2" fill="#94A3B8">BUILD</text>
    <text x="97" y="63" text-anchor="middle" font-size="19" font-weight="700" fill="#94A3B8">UNVERIFIED</text>
  </g>
  <g transform="translate(645 0)">
    <rect x="1" y="1" width="193" height="86" rx="14" fill="#0D1828" stroke="#94A3B8" stroke-opacity=".55" stroke-width="1.5"/>
    <circle class="dot" cx="20" cy="22" r="4.5" fill="#94A3B8"/>
    <text x="32" y="26" font-size="12" letter-spacing="2" fill="#94A3B8">MANIFEST</text>
    <text x="97" y="63" text-anchor="middle" font-size="19" font-weight="700" fill="#94A3B8">UNVERIFIED</text>
  </g>
  <text x="420" y="110" text-anchor="middle" font-size="11" fill="#64748B">Not run yet - every value is UNVERIFIED until scripts/gen-status-cards.mjs is executed</text>

  <!-- zy-laser:start -->
  <style>
    @keyframes zy-lz  { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    @keyframes zy-lzr { from { stroke-dashoffset: 0; }   to { stroke-dashoffset: 100; } }
    .zy-lz  { stroke-dasharray: 14 86; animation: zy-lz 6s linear infinite; }
    .zy-lzr { stroke-dasharray: 9 91;  animation: zy-lzr 8s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .zy-lz, .zy-lzr { animation: none; } }
  </style>
  <defs>
    <linearGradient id="zy-laser-g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#10B981"/><stop offset="0.5" stop-color="#2DD4BF"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
    <filter id="zy-laser-f" filterUnits="userSpaceOnUse" x="-20" y="-20" width="880" height="160"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g transform="translate(0 0)">
    <rect x="1" y="1" width="193" height="86" rx="14" fill="none" stroke-linecap="round" pathLength="100" stroke="url(#zy-laser-g)" stroke-width="1.8" class="zy-lz" style="animation-delay:0s" filter="url(#zy-laser-f)"/>
    <rect x="1" y="1" width="193" height="86" rx="14" fill="none" stroke-linecap="round" pathLength="100" stroke="#38BDF8" stroke-width="1.26" class="zy-lzr" style="animation-delay:0s" filter="url(#zy-laser-f)"/>
  </g>
  <g transform="translate(215 0)">
    <rect x="1" y="1" width="193" height="86" rx="14" fill="none" stroke-linecap="round" pathLength="100" stroke="url(#zy-laser-g)" stroke-width="1.8" class="zy-lz" style="animation-delay:-1.5s" filter="url(#zy-laser-f)"/>
    <rect x="1" y="1" width="193" height="86" rx="14" fill="none" stroke-linecap="round" pathLength="100" stroke="#38BDF8" stroke-width="1.26" class="zy-lzr" style="animation-delay:-1.5s" filter="url(#zy-laser-f)"/>
  </g>
  <g transform="translate(430 0)">
    <rect x="1" y="1" width="193" height="86" rx="14" fill="none" stroke-linecap="round" pathLength="100" stroke="url(#zy-laser-g)" stroke-width="1.8" class="zy-lz" style="animation-delay:-3s" filter="url(#zy-laser-f)"/>
    <rect x="1" y="1" width="193" height="86" rx="14" fill="none" stroke-linecap="round" pathLength="100" stroke="#38BDF8" stroke-width="1.26" class="zy-lzr" style="animation-delay:-3s" filter="url(#zy-laser-f)"/>
  </g>
  <g transform="translate(645 0)">
    <rect x="1" y="1" width="193" height="86" rx="14" fill="none" stroke-linecap="round" pathLength="100" stroke="url(#zy-laser-g)" stroke-width="1.8" class="zy-lz" style="animation-delay:-4.5s" filter="url(#zy-laser-f)"/>
    <rect x="1" y="1" width="193" height="86" rx="14" fill="none" stroke-linecap="round" pathLength="100" stroke="#38BDF8" stroke-width="1.26" class="zy-lzr" style="animation-delay:-4.5s" filter="url(#zy-laser-f)"/>

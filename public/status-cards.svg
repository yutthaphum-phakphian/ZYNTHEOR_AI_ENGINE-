<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 130" width="840" height="130" role="img" aria-label="Local status cards">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1524"/>
      <stop offset="100%" stop-color="#060E18"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0"/>
      <stop offset="15%" stop-color="#0D9488" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#38BDF8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-25%" y="-40%" width="150%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="840" height="130" rx="18" fill="#03070E"/>

  <!-- Premium top flowing line -->
  <path d="M 0 10
           C 90 3, 180 18, 280 7
           S 450 2, 560 12
           S 700 20, 840 6"
        fill="none" stroke="url(#wave)" stroke-width="1.8" opacity="0.85" filter="url(#g)"/>
  <path d="M 0 16
           C 110 22, 200 6, 320 14
           S 480 24, 600 10
           S 740 4, 840 16"
        fill="none" stroke="#14B8A6" stroke-width="0.9" opacity="0.3"/>

  <!-- Card 1 -->
  <g transform="translate(16, 26)">
    <rect width="192" height="76" rx="14" fill="url(#cardBg)" stroke="#134E4A" stroke-width="1.25"/>
    <path d="M 14 9 C 40 4, 70 13, 110 7 S 160 4, 178 10" fill="none" stroke="#0D9488" stroke-width="1.15" opacity="0.55"/>
    <circle cx="24" cy="26" r="4.5" fill="#64748B"/>
    <text x="38" y="30" font-family="system-ui,sans-serif" font-size="11" letter-spacing="1.6" fill="#94A3B8">TESTS</text>
    <text x="96" y="58" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17.5" font-weight="700" fill="#94A3B8">UNVERIFIED</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(224, 26)">
    <rect width="192" height="76" rx="14" fill="url(#cardBg)" stroke="#134E4A" stroke-width="1.25"/>
    <path d="M 14 9 C 40 4, 70 13, 110 7 S 160 4, 178 10" fill="none" stroke="#14B8A6" stroke-width="1.15" opacity="0.55"/>
    <circle cx="24" cy="26" r="4.5" fill="#64748B"/>
    <text x="38" y="30" font-family="system-ui,sans-serif" font-size="11" letter-spacing="1.6" fill="#94A3B8">TYPE ERRORS</text>
    <text x="96" y="58" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17.5" font-weight="700" fill="#94A3B8">UNVERIFIED</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(432, 26)">
    <rect width="192" height="76" rx="14" fill="url(#cardBg)" stroke="#134E4A" stroke-width="1.25"/>
    <path d="M 14 9 C 40 4, 70 13, 110 7 S 160 4, 178 10" fill="none" stroke="#22D3EE" stroke-width="1.15" opacity="0.55"/>
    <circle cx="24" cy="26" r="4.5" fill="#64748B"/>
    <text x="38" y="30" font-family="system-ui,sans-serif" font-size="11" letter-spacing="1.6" fill="#94A3B8">BUILD</text>
    <text x="96" y="58" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17.5" font-weight="700" fill="#94A3B8">UNVERIFIED</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(640, 26)">
    <rect width="184" height="76" rx="14" fill="url(#cardBg)" stroke="#134E4A" stroke-width="1.25"/>
    <path d="M 14 9 C 40 4, 70 13, 100 7 S 150 4, 170 10" fill="none" stroke="#67E8F9" stroke-width="1.15" opacity="0.55"/>
    <circle cx="24" cy="26" r="4.5" fill="#64748B"/>
    <text x="38" y="30" font-family="system-ui,sans-serif" font-size="11" letter-spacing="1.6" fill="#94A3B8">MANIFEST</text>
    <text x="92" y="58" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17.5" font-weight="700" fill="#94A3B8">UNVERIFIED</text>
  </g>

  <text x="420" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#475569">
    Values update when scripts/gen-status-cards.mjs runs · currently UNVERIFIED
  </text>
</svg>

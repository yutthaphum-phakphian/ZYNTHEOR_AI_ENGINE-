<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 130" width="840" height="130" role="img" aria-label="ZYNTHEOR AI ENGINE Buffalo Edition Sovereign Footer">
  <defs>
    <linearGradient id="ft-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08101E"/><stop offset="0.5" stop-color="#0B182B"/><stop offset="1" stop-color="#07101C"/></linearGradient>
    <linearGradient id="ft-laser" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#10B981"/><stop offset="0.5" stop-color="#38BDF8"/><stop offset="1" stop-color="#2DD4BF"/></linearGradient>
    <linearGradient id="ft-title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34D399"/><stop offset="0.5" stop-color="#38BDF8"/><stop offset="1" stop-color="#60A5FA"/></linearGradient>
    <linearGradient id="ft-beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2DD4BF" stop-opacity="0"/><stop offset="0.5" stop-color="#2DD4BF" stop-opacity="0.12"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></linearGradient>
    <linearGradient id="bf-horn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14B8A6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <linearGradient id="bf-body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0D9488"/><stop offset="1" stop-color="#0F766E"/></linearGradient>
    <pattern id="ft-grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M 26 0 L 0 0 0 26" fill="none" stroke="#132338" stroke-width="0.7" stroke-opacity="0.4"/></pattern>
    <filter id="ft-glow" filterUnits="userSpaceOnUse" x="-20" y="-20" width="880" height="170"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="ft-clip"><rect x="4" y="4" width="832" height="122" rx="16"/></clipPath>
  </defs>
  <style>
    @keyframes lz   { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    @keyframes lzr  { from { stroke-dashoffset: 0; }   to { stroke-dashoffset: 100; } }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    @keyframes beam { from { transform: translateX(-220px); } to { transform: translateX(1060px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes blink { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes pulse { 0%,100% { transform: scale(.94); opacity: .85; } 50% { transform: scale(1.06); opacity: 1; } }
    .lz   { stroke-dasharray: 14 86; animation: lz 6s linear infinite; }
    .lzr  { stroke-dasharray: 9 91;  animation: lzr 8s linear infinite; }
    .flow { stroke-dasharray: 5 7;   animation: flow 1.4s linear infinite; }
    .run  { stroke-dasharray: 9 91;  animation: lz 4.2s linear infinite; }
    .beam { animation: beam 9s linear infinite; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 18s linear infinite; }
    .blink{ animation: blink 2.8s ease-in-out infinite; }
    .pulse{ transform-box: fill-box; transform-origin: center; animation: pulse 3s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .lz,.lzr,.flow,.run,.beam,.spin,.blink,.pulse { animation: none; }
      .beam { opacity: 0; }
    }
  </style>

  <rect x="4" y="4" width="832" height="122" rx="16" fill="url(#ft-bg)" stroke="#16324D" stroke-width="1.2"/>
  <g clip-path="url(#ft-clip)">
    <rect x="4" y="4" width="832" height="122" fill="url(#ft-grid)"/>
    <rect class="beam" x="0" y="4" width="180" height="122" fill="url(#ft-beam)"/>
  </g>

  <!-- side circuit lines with runners -->
  <g fill="none" stroke-linecap="round">
    <path d="M 36 34 H 300 L 330 34" stroke="#1B4A6B" stroke-width="1.2" class="flow"/>
    <path d="M 36 34 H 330" pathLength="100" stroke="#5EEAD4" stroke-width="2" class="run" filter="url(#ft-glow)"/>
    <path d="M 804 34 H 540 L 510 34" stroke="#1B4A6B" stroke-width="1.2" class="flow"/>
    <path d="M 804 34 H 510" pathLength="100" stroke="#38BDF8" stroke-width="2" class="run" style="animation-delay:-2s" filter="url(#ft-glow)"/>
  </g>
  <circle cx="36" cy="34" r="2.4" fill="#14B8A6"/><circle cx="804" cy="34" r="2.4" fill="#38BDF8"/>
  <circle cx="330" cy="34" r="3" fill="#10B981" class="blink"/><circle cx="510" cy="34" r="3" fill="#38BDF8" class="blink" style="animation-delay:-1.2s"/>

  <!-- emblem -->
  <g transform="translate(420, 34)">
    <circle r="25" fill="none" stroke="#2DD4BF" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="2 7" class="spin"/>
    <polygon points="0,-19 16.5,-9.5 16.5,9.5 0,19 -16.5,9.5 -16.5,-9.5" fill="#0C2036" stroke="#14B8A6" stroke-width="1.4"/>
    <g class="pulse"><g transform="scale(0.4) translate(-32,-30)">
      <path d="M18 22 L8 8 L14 10 L22 20 Z" fill="url(#bf-horn)"/>
      <path d="M46 22 L56 8 L50 10 L42 20 Z" fill="url(#bf-horn)"/>
      <path d="M20 24 L32 18 L44 24 L46 38 L32 48 L18 38 Z" fill="url(#bf-body)" stroke="#134E4A" stroke-width="1.2"/>
      <path d="M24 28 L32 24 L40 28 L41 36 L32 42 L23 36 Z" fill="#0A1624" opacity="0.55"/>
      <circle cx="27" cy="32" r="1.8" fill="#5EEAD4"/>
      <circle cx="37" cy="32" r="1.8" fill="#5EEAD4"/>
    </g></g>
  </g>

  <text x="420" y="76" text-anchor="middle" font-family="'Noto Sans Thai','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif" font-size="18" font-weight="800" letter-spacing="4" fill="url(#ft-title)">ZYNTHEOR AI ENGINE</text>
  <text x="420" y="95" text-anchor="middle" font-family="'Segoe UI','Noto Sans Thai',sans-serif" font-size="10.5" font-weight="600" letter-spacing="2" fill="#2DD4BF">BUFFALO EDITION · SOVEREIGN LOCAL-FIRST INTELLIGENCE CORE</text>
  <text x="420" y="112" text-anchor="middle" font-family="'Noto Sans Thai','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif" font-size="9" letter-spacing="1" fill="#64748B">AGPL-3.0 · CRYPTOGRAPHIC GOVERNANCE BASELINE · NO-SIMULATION POLICY</text>

  <rect x="4" y="4" width="832" height="122" rx="16" fill="none" stroke="url(#ft-laser)" stroke-width="2.4" stroke-linecap="round" pathLength="100" class="lz" filter="url(#ft-glow)"/>
  <rect x="4" y="4" width="832" height="122" rx="16" fill="none" stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round" pathLength="100" class="lzr" filter="url(#ft-glow)"/>
</svg>

    <line x1="14" y1="144" x2="184" y2="144" pathLength="100" stroke="url(#fc-g3)" stroke-width="2" stroke-linecap="round" class="run" style="animation-delay:-3.0s" filter="url(#fc-glow)"/>
    <rect x="0" y="0" width="198" height="158" rx="12" fill="none" stroke="url(#fc-g3)" stroke-width="1.8" stroke-linecap="round" pathLength="100" class="lz" style="animation-delay:-6.0s" filter="url(#fc-glow)"/>
  </g>

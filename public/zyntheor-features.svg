      <stop offset="0%" stop-color="#0A1524"/>
      <stop offset="100%" stop-color="#060E18"/>
    </linearGradient>
    <linearGradient id="t1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488"/><stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="t2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14B8A6"/><stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="t3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#38BDF8"/>

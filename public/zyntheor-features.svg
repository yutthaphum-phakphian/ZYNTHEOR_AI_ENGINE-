    <linearGradient id="topwave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0"/>
      <stop offset="20%" stop-color="#0D9488" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#38BDF8" stop-opacity="0.65"/>

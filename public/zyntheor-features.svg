<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 170" width="840" height="170" role="img" aria-label="ZYNTHEOR AI ENGINE Core Engineering Pillars">
  <defs>
    <linearGradient id="fc-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1E33"/><stop offset="1" stop-color="#081424"/></linearGradient>
    <linearGradient id="fc-g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#10B981"/><stop offset="1" stop-color="#14B8A6"/></linearGradient>
    <linearGradient id="fc-g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#14B8A6"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
    <linearGradient id="fc-g3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#0EA5E9"/></linearGradient>
    <linearGradient id="fc-g4" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#10B981"/></linearGradient>
    <filter id="fc-glow" filterUnits="userSpaceOnUse" x="-12" y="-12" width="226" height="184"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    @keyframes lz   { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    @keyframes lzr  { from { stroke-dashoffset: 0; }   to { stroke-dashoffset: 100; } }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    @keyframes beam { from { transform: translateX(-220px); } to { transform: translateX(1060px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes blink { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes pulse { 0%,100% { transform: scale(.94); opacity: .85; } 50% { transform: scale(1.06); opacity: 1; } }
    .lz   { stroke-dasharray: 14 86; animation: lz 6s linear infinite; }
    .lzr  { stroke-dasharray: 9 91;  animation: lzr 8s linear infinite; }
    .flow { stroke-dasharray: 5 7;   animation: flow 1.4s linear infinite; }
    .run  { stroke-dasharray: 9 91;  animation: lz 4.2s linear infinite; }
    .beam { animation: beam 9s linear infinite; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 18s linear infinite; }
    .blink{ animation: blink 2.8s ease-in-out infinite; }
    .pulse{ transform-box: fill-box; transform-origin: center; animation: pulse 3s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .lz,.lzr,.flow,.run,.beam,.spin,.blink,.pulse { animation: none; }
      .beam { opacity: 0; }
    }
  </style>

  <!-- Card 1 -->
  <g transform="translate(6, 6)">
    <rect x="0" y="0" width="198" height="158" rx="12" fill="url(#fc-bg)" stroke="#163450" stroke-width="1.2"/>
    <rect x="12" y="10" width="34" height="3" rx="1.5" fill="url(#fc-g1)"/>
    <g transform="translate(156, 16)"><circle cx="14" cy="14" r="14" fill="#0E2B38"/><polygon points="14,6 22,10 22,18 14,22 6,18 6,10" fill="none" stroke="#2DD4BF" stroke-width="1.4"/><circle cx="14" cy="14" r="2.5" fill="#10B981"/><circle cx="14" cy="14" r="16.5" fill="none" stroke="#2DD4BF" stroke-opacity="0.6" stroke-width="0.9" stroke-dasharray="2 6" class="spin"/></g>
    <text x="14" y="38" font-family="'Segoe UI','Noto Sans Thai',sans-serif" font-size="9" font-weight="800" letter-spacing="1.5" fill="#2DD4BF">PILLAR 01</text>
    <text x="14" y="58" font-family="'Noto Sans Thai','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif" font-size="13" font-weight="700" fill="#F1F5F9">Sovereign Local-First</text>
    <text x="14" y="78" font-family="'Noto Sans Thai','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif" font-size="10" font-weight="600" fill="#94A3B8">ประมวลผลภายในเครื่องเป็นหลัก</text>
    <text font-family="'Noto Sans Thai','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif" font-size="9" fill="#7C8FA6">
      <tspan x="14" y="98">• Local Inference ผ่าน Ollama</tspan><tspan x="14" y="112">• Local-Only Mode เป็นค่าเริ่มต้น</tspan><tspan x="14" y="126">• Cloud ต้องได้รับความยินยอม</tspan>
    </text>
    <line x1="14" y1="144" x2="184" y2="144" stroke="#163C5A" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.8"/>
    <line x1="14" y1="144" x2="184" y2="144" pathLength="100" stroke="url(#fc-g1)" stroke-width="2" stroke-linecap="round" class="run" style="animation-delay:0.0s" filter="url(#fc-glow)"/>
    <rect x="0" y="0" width="198" height="158" rx="12" fill="none" stroke="url(#fc-g1)" stroke-width="1.8" stroke-linecap="round" pathLength="100" class="lz" style="animation-delay:0.0s" filter="url(#fc-glow)"/>
  </g>
  <!-- Card 2 -->

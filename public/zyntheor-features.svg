    <g transform="translate(156, 16)"><circle cx="14" cy="14" r="14" fill="#0C263D"/><rect x="9" y="9" width="10" height="10" rx="2" fill="none" stroke="#38BDF8" stroke-width="1.4"/><line x1="14" y1="6" x2="14" y2="9" stroke="#38BDF8" stroke-width="1.2"/><line x1="14" y1="19" x2="14" y2="22" stroke="#38BDF8" stroke-width="1.2"/><circle cx="14" cy="14" r="16.5" fill="none" stroke="#38BDF8" stroke-opacity="0.6" stroke-width="0.9" stroke-dasharray="2 6" class="spin"/></g>
    <text x="14" y="38" font-family="'Segoe UI','Noto Sans Thai',sans-serif" font-size="9" font-weight="800" letter-spacing="1.5" fill="#38BDF8">PILLAR 02</text>
    <text x="14" y="58" font-family="'Noto Sans Thai','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif" font-size="13" font-weight="700" fill="#F1F5F9">SHA-256 Evidence</text>
    <text x="14" y="78" font-family="'Noto Sans Thai','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif" font-size="10" font-weight="600" fill="#94A3B8">สมุดบัญชีตรวจสอบแบบ Hash Chain</text>
    <text font-family="'Noto Sans Thai','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif" font-size="9" fill="#7C8FA6">
      <tspan x="14" y="98">• Hash Chain เชื่อมต่อเหตุการณ์</tspan><tspan x="14" y="112">• ตรวจจับการแก้ไข (Tamper-Evident)</tspan><tspan x="14" y="126">• Export หลักฐาน Forensic CSV</tspan>
    </text>
    <line x1="14" y1="144" x2="184" y2="144" stroke="#163C5A" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.8"/>
    <line x1="14" y1="144" x2="184" y2="144" pathLength="100" stroke="url(#fc-g2)" stroke-width="2" stroke-linecap="round" class="run" style="animation-delay:-1.5s" filter="url(#fc-glow)"/>
    <rect x="0" y="0" width="198" height="158" rx="12" fill="none" stroke="url(#fc-g2)" stroke-width="1.8" stroke-linecap="round" pathLength="100" class="lz" style="animation-delay:-3.0s" filter="url(#fc-glow)"/>
  </g>
  <!-- Card 3 -->
  <g transform="translate(426, 6)">

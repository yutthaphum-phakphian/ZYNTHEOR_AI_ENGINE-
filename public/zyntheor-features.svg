    <g transform="translate(156, 16)"><circle cx="14" cy="14" r="14" fill="#0C2B22"/><path d="M 8 18 L 14 8 L 20 18 Z" fill="none" stroke="#34D399" stroke-width="1.4"/><circle cx="14" cy="15" r="1.5" fill="#34D399"/><circle cx="14" cy="14" r="16.5" fill="none" stroke="#34D399" stroke-opacity="0.6" stroke-width="0.9" stroke-dasharray="2 6" class="spin"/></g>
    <text x="14" y="38" font-family="'Segoe UI','Noto Sans Thai',sans-serif" font-size="9" font-weight="800" letter-spacing="1.5" fill="#34D399">PILLAR 04</text>
    <text x="14" y="58" font-family="'Noto Sans Thai','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif" font-size="13" font-weight="700" fill="#F1F5F9">Dual-Engine Core</text>
    <text x="14" y="78" font-family="'Noto Sans Thai','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif" font-size="10" font-weight="600" fill="#94A3B8">ประมวลผลสองระดับ</text>
    <text font-family="'Noto Sans Thai','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif" font-size="9" fill="#7C8FA6">

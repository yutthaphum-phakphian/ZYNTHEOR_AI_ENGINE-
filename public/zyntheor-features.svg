<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 176" width="840" height="176" role="img" aria-label="ZYNTHEOR AI ENGINE Core Engineering Pillars">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="fc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081424"/>
      <stop offset="100%" stop-color="#040A14"/>
    </linearGradient>

    <!-- Rainbow Gradient -->
    <linearGradient id="fc-rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1A53"/>
      <stop offset="18%" stop-color="#FF8A00"/>
      <stop offset="36%" stop-color="#FFDD00"/>
      <stop offset="54%" stop-color="#00F59B"/>
      <stop offset="72%" stop-color="#00D2FF"/>
      <stop offset="86%" stop-color="#3A6DFF"/>
      <stop offset="100%" stop-color="#B336FF"/>
    </linearGradient>

    <linearGradient id="fc-g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#10B981"/><stop offset="1" stop-color="#14B8A6"/></linearGradient>
    <linearGradient id="fc-g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#14B8A6"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
    <linearGradient id="fc-g3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#818CF8"/></linearGradient>
    <linearGradient id="fc-g4" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#10B981"/></linearGradient>

    <filter id="fc-rainbow-glow" filterUnits="userSpaceOnUse" x="-20" y="-20" width="880" height="220">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes fc-rainbow-run {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes fc-spin {
      to { transform: rotate(360deg); }
    }
    @keyframes fc-blink {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    .fc-rainbow-laser {
      stroke-dasharray: 20 80;
      animation: fc-rainbow-run 5s linear infinite;
    }
    .fc-rainbow-line {
      stroke-dasharray: 14 86;
      animation: fc-rainbow-run 3.2s linear infinite;
    }
    .fc-spin {
      transform-box: fill-box;
      transform-origin: center;
      animation: fc-spin 16s linear infinite;
    }
    .fc-blink {
      animation: fc-blink 2.6s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .fc-rainbow-laser, .fc-rainbow-line, .fc-spin, .fc-blink { animation: none; }
    }
  </style>

  <!-- Card 1: Sovereign Local-First -->
  <g transform="translate(6, 6)">
    <rect x="0" y="0" width="198" height="164" rx="13" fill="url(#fc-bg)" stroke="#163854" stroke-width="1.3"/>
    <rect x="14" y="12" width="34" height="3" rx="1.5" fill="url(#fc-g1)"/>
    <g transform="translate(156, 16)">
      <circle cx="14" cy="14" r="14" fill="#0C2534"/>
      <polygon points="14,6 22,10 22,18 14,22 6,18 6,10" fill="none" stroke="#2DD4BF" stroke-width="1.5"/>
      <circle cx="14" cy="14" r="2.8" fill="#10B981"/>
      <circle cx="14" cy="14" r="16.5" fill="none" stroke="#2DD4BF" stroke-opacity="0.6" stroke-width="1" stroke-dasharray="2 6" class="fc-spin"/>
    </g>
    <text x="14" y="38" font-family="'Space Grotesk',sans-serif" font-size="9" font-weight="800" letter-spacing="1.5" fill="#2DD4BF">PILLAR 01</text>
    <text x="14" y="58" font-family="'Space Grotesk',sans-serif" font-size="13.5" font-weight="700" fill="#F8FAFC">Sovereign Local-First</text>
    <text x="14" y="78" font-family="'Noto Sans Thai',sans-serif" font-size="10" font-weight="600" fill="#94A3B8">ประมวลผลบนเครื่อง 100%</text>
    <text font-family="'Noto Sans Thai',sans-serif" font-size="9" fill="#7C8FA6">
      <tspan x="14" y="98">• Airgap Enclave &amp; Ollama</tspan>
      <tspan x="14" y="112">• Local-Only Mode เริ่มต้น</tspan>
      <tspan x="14" y="126">• ตัดขาด Telemetry 100%</tspan>
    </text>
    <line x1="14" y1="148" x2="184" y2="148" stroke="#143248" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="14" y1="148" x2="184" y2="148" pathLength="100" stroke="url(#fc-rainbow)" stroke-width="2.4" stroke-linecap="round" class="fc-rainbow-line" style="animation-delay:0.0s" filter="url(#fc-rainbow-glow)"/>

    <!-- Running Rainbow Laser (เส้นรุ้งวิ่ง) -->
    <rect x="0" y="0" width="198" height="164" rx="13" fill="none" stroke="url(#fc-rainbow)" stroke-width="2.6" stroke-linecap="round" pathLength="100" class="fc-rainbow-laser" style="animation-delay:0.0s" filter="url(#fc-rainbow-glow)"/>
  </g>

  <!-- Card 2: SHA-256 Evidence -->
  <g transform="translate(216, 6)">
    <rect x="0" y="0" width="198" height="164" rx="13" fill="url(#fc-bg)" stroke="#163854" stroke-width="1.3"/>
    <rect x="14" y="12" width="34" height="3" rx="1.5" fill="url(#fc-g2)"/>
    <g transform="translate(156, 16)">
      <circle cx="14" cy="14" r="14" fill="#0C2538"/>
      <rect x="9" y="9" width="10" height="10" rx="2" fill="none" stroke="#38BDF8" stroke-width="1.5"/>
      <circle cx="14" cy="14" r="2.8" fill="#38BDF8"/>
      <circle cx="14" cy="14" r="16.5" fill="none" stroke="#38BDF8" stroke-opacity="0.6" stroke-width="1" stroke-dasharray="2 6" class="fc-spin"/>
    </g>
    <text x="14" y="38" font-family="'Space Grotesk',sans-serif" font-size="9" font-weight="800" letter-spacing="1.5" fill="#38BDF8">PILLAR 02</text>
    <text x="14" y="58" font-family="'Space Grotesk',sans-serif" font-size="13.5" font-weight="700" fill="#F8FAFC">SHA-256 Evidence</text>
    <text x="14" y="78" font-family="'Noto Sans Thai',sans-serif" font-size="10" font-weight="600" fill="#94A3B8">หลักฐานนิติวิทยาศาสตร์</text>
    <text font-family="'Noto Sans Thai',sans-serif" font-size="9" fill="#7C8FA6">
      <tspan x="14" y="98">• 14,902 Seals Verified</tspan>
      <tspan x="14" y="112">• Merkle Root #849202</tspan>
      <tspan x="14" y="126">• PAdES QR &amp; SSoT Δ0.00%</tspan>
    </text>
    <line x1="14" y1="148" x2="184" y2="148" stroke="#143248" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="14" y1="148" x2="184" y2="148" pathLength="100" stroke="url(#fc-rainbow)" stroke-width="2.4" stroke-linecap="round" class="fc-rainbow-line" style="animation-delay:-0.8s" filter="url(#fc-rainbow-glow)"/>

    <!-- Running Rainbow Laser -->
    <rect x="0" y="0" width="198" height="164" rx="13" fill="none" stroke="url(#fc-rainbow)" stroke-width="2.6" stroke-linecap="round" pathLength="100" class="fc-rainbow-laser" style="animation-delay:-1.25s" filter="url(#fc-rainbow-glow)"/>
  </g>

  <!-- Card 3: Visual Governance -->
  <g transform="translate(426, 6)">
    <rect x="0" y="0" width="198" height="164" rx="13" fill="url(#fc-bg)" stroke="#163854" stroke-width="1.3"/>
    <rect x="14" y="12" width="34" height="3" rx="1.5" fill="url(#fc-g3)"/>
    <g transform="translate(156, 16)">
      <circle cx="14" cy="14" r="14" fill="#141E38"/>
      <circle cx="14" cy="14" r="7" fill="none" stroke="#818CF8" stroke-width="2" stroke-dasharray="14 10"/>
      <circle cx="14" cy="14" r="2.8" fill="#818CF8"/>
      <circle cx="14" cy="14" r="16.5" fill="none" stroke="#818CF8" stroke-opacity="0.6" stroke-width="1" stroke-dasharray="2 6" class="fc-spin"/>
    </g>
    <text x="14" y="38" font-family="'Space Grotesk',sans-serif" font-size="9" font-weight="800" letter-spacing="1.5" fill="#818CF8">PILLAR 03</text>
    <text x="14" y="58" font-family="'Space Grotesk',sans-serif" font-size="13.5" font-weight="700" fill="#F8FAFC">Visual Governance</text>
    <text x="14" y="78" font-family="'Noto Sans Thai',sans-serif" font-size="10" font-weight="600" fill="#94A3B8">ระบบตรวจสอบด้วยภาพ</text>
    <text font-family="'Noto Sans Thai',sans-serif" font-size="9" fill="#7C8FA6">
      <tspan x="14" y="98">• 12 Evaluation Categories</tspan>
      <tspan x="14" y="112">• D3.js AST Dependency Map</tspan>
      <tspan x="14" y="126">• Recharts Role Distribution</tspan>
    </text>
    <line x1="14" y1="148" x2="184" y2="148" stroke="#143248" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="14" y1="148" x2="184" y2="148" pathLength="100" stroke="url(#fc-rainbow)" stroke-width="2.4" stroke-linecap="round" class="fc-rainbow-line" style="animation-delay:-1.6s" filter="url(#fc-rainbow-glow)"/>


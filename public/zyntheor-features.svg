    <g transform="translate(156, 16)"><circle cx="14" cy="14" r="14" fill="#0B2A3A"/><circle cx="14" cy="14" r="7" fill="none" stroke="#22D3EE" stroke-width="2" stroke-dasharray="14 10"/><circle cx="14" cy="14" r="2.5" fill="#22D3EE"/><circle cx="14" cy="14" r="16.5" fill="none" stroke="#22D3EE" stroke-opacity="0.6" stroke-width="0.9" stroke-dasharray="2 6" class="spin"/></g>
    <text x="14" y="38" font-family="'Segoe UI','Noto Sans Thai',sans-serif" font-size="9" font-weight="800" letter-spacing="1.5" fill="#22D3EE">PILLAR 03</text>
    <text x="14" y="58" font-family="'Noto Sans Thai','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif" font-size="13" font-weight="700" fill="#F1F5F9">Visual Governance</text>
    <text x="14" y="78" font-family="'Noto Sans Thai','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif" font-size="10" font-weight="600" fill="#94A3B8">สถิติและแผนผังเชิงโต้ตอบ</text>
    <text font-family="'Noto Sans Thai','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif" font-size="9" fill="#7C8FA6">

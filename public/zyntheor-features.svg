    <rect x="0" y="0" width="198" height="164" rx="13" fill="none" stroke="url(#fc-rainbow)" stroke-width="2.6" stroke-linecap="round" pathLength="100" class="fc-rainbow-laser" style="animation-delay:-2.5s" filter="url(#fc-rainbow-glow)"/>
  </g>

  <!-- Card 4: Dual-Engine Core -->
  <g transform="translate(636, 6)">
    <rect x="0" y="0" width="198" height="164" rx="13" fill="url(#fc-bg)" stroke="#163854" stroke-width="1.3"/>
    <rect x="14" y="12" width="34" height="3" rx="1.5" fill="url(#fc-g4)"/>
    <g transform="translate(156, 16)">
      <circle cx="14" cy="14" r="14" fill="#0A261C"/>
      <path d="M 8 18 L 14 8 L 20 18 Z" fill="none" stroke="#34D399" stroke-width="1.5"/>
      <circle cx="14" cy="15" r="1.8" fill="#34D399"/>
      <circle cx="14" cy="14" r="16.5" fill="none" stroke="#34D399" stroke-opacity="0.6" stroke-width="1" stroke-dasharray="2 6" class="fc-spin"/>
    </g>
    <text x="14" y="38" font-family="'Space Grotesk',sans-serif" font-size="9" font-weight="800" letter-spacing="1.5" fill="#34D399">PILLAR 04</text>
    <text x="14" y="58" font-family="'Space Grotesk',sans-serif" font-size="13.5" font-weight="700" fill="#F8FAFC">Dual-Engine Core</text>
    <text x="14" y="78" font-family="'Noto Sans Thai',sans-serif" font-size="10" font-weight="600" fill="#94A3B8">ประมวลผลสองระดับ</text>
    <text font-family="'Noto Sans Thai',sans-serif" font-size="9" fill="#7C8FA6">
      <tspan x="14" y="98">• Buffalo First-Party Core</tspan>
      <tspan x="14" y="112">• Internet Gateway BKK/FRA</tspan>
      <tspan x="14" y="126">• Human Approval Safety Gate</tspan>
    </text>
    <line x1="14" y1="148" x2="184" y2="148" stroke="#143248" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="14" y1="148" x2="184" y2="148" pathLength="100" stroke="url(#fc-rainbow)" stroke-width="2.4" stroke-linecap="round" class="fc-rainbow-line" style="animation-delay:-2.4s" filter="url(#fc-rainbow-glow)"/>

    <!-- Running Rainbow Laser -->
    <rect x="0" y="0" width="198" height="164" rx="13" fill="none" stroke="url(#fc-rainbow)" stroke-width="2.6" stroke-linecap="round" pathLength="100" class="fc-rainbow-laser" style="animation-delay:-3.75s" filter="url(#fc-rainbow-glow)"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 180" width="840" height="180" role="img" aria-label="ZYNTHEOR AI ENGINE Core Engineering Pillars">
  <defs>
    <linearGradient id="feat-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1A2C" />
      <stop offset="100%" stop-color="#06101E" />
    </linearGradient>

    <linearGradient id="feat-teal-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>

    <linearGradient id="feat-cyan-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="feat-blue-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="feat-emerald-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="feat-topwave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0" />
      <stop offset="25%" stop-color="#0D9488" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <filter id="feat-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Background Canvas -->
  <rect width="840" height="180" rx="16" fill="#040914" stroke="#122538" stroke-width="1.2" />

  <!-- Subtle Ambient Glow Waves -->
  <path d="M 0 10 C 120 2, 240 20, 360 8 S 560 3, 680 15 S 780 22, 840 8" fill="none" stroke="url(#feat-topwave)" stroke-width="2" opacity="0.85" filter="url(#feat-glow)" />
  <path d="M 0 18 C 140 24, 260 8, 400 18 S 580 26, 700 12 S 800 6, 840 16" fill="none" stroke="#14B8A6" stroke-width="1" opacity="0.3" />

  <!-- 4 Feature Cards Layout: 840 wide, cards 194 wide, gaps 12 -->

  <!-- Card 1: Sovereign Local-First -->
  <g transform="translate(12, 24)">
    <rect x="0" y="0" width="194" height="142" rx="12" fill="url(#feat-card-bg)" stroke="#15324D" stroke-width="1.2" />
    <rect x="14" y="12" width="36" height="3" rx="1.5" fill="url(#feat-teal-bar)" filter="url(#feat-glow)" />
    <!-- Glyph -->
    <g transform="translate(150, 14)">
      <circle cx="14" cy="14" r="14" fill="#091F2C" />
      <polygon points="14,6 21,10 21,18 14,22 7,18 7,10" fill="none" stroke="#2DD4BF" stroke-width="1.4" />
      <circle cx="14" cy="14" r="2.5" fill="#10B981" />
    </g>
    <text x="14" y="38" font-family="'Segoe UI',sans-serif" font-size="9" font-weight="800" letter-spacing="1.5" fill="#2DD4BF">PILLAR 01</text>
    <text x="14" y="58" font-family="'Noto Sans Thai','Segoe UI',sans-serif" font-size="13.5" font-weight="700" fill="#F1F5F9">Sovereign Core</text>
    <text x="14" y="76" font-family="'Noto Sans Thai','Segoe UI',sans-serif" font-size="10" font-weight="600" fill="#94A3B8">Local-First Architecture</text>
    <text x="14" y="96" font-family="'Noto Sans Thai','Segoe UI',sans-serif" font-size="9.5" fill="#64748B">
      <tspan x="14" dy="0">• Air-Gap &amp; Offline Ready</tspan>
      <tspan x="14" dy="14">• Zero Forced Cloud Call</tspan>
      <tspan x="14" dy="14">• Strict Private Data Shield</tspan>
    </text>
  </g>

  <!-- Card 2: Cryptographic Evidence -->
  <g transform="translate(218, 24)">
    <rect x="0" y="0" width="194" height="142" rx="12" fill="url(#feat-card-bg)" stroke="#15324D" stroke-width="1.2" />
    <rect x="14" y="12" width="36" height="3" rx="1.5" fill="url(#feat-cyan-bar)" filter="url(#feat-glow)" />
    <!-- Glyph -->
    <g transform="translate(150, 14)">
      <circle cx="14" cy="14" r="14" fill="#0A1D33" />
      <rect x="9" y="9" width="10" height="10" rx="2" fill="none" stroke="#38BDF8" stroke-width="1.4" />
      <line x1="14" y1="6" x2="14" y2="9" stroke="#38BDF8" stroke-width="1.2" />
      <line x1="14" y1="19" x2="14" y2="22" stroke="#38BDF8" stroke-width="1.2" />
    </g>
    <text x="14" y="38" font-family="'Segoe UI',sans-serif" font-size="9" font-weight="800" letter-spacing="1.5" fill="#38BDF8">PILLAR 02</text>
    <text x="14" y="58" font-family="'Noto Sans Thai','Segoe UI',sans-serif" font-size="13.5" font-weight="700" fill="#F1F5F9">SHA-256 Ledger</text>
    <text x="14" y="76" font-family="'Noto Sans Thai','Segoe UI',sans-serif" font-size="10" font-weight="600" fill="#94A3B8">Cryptographic Chain</text>
    <text x="14" y="96" font-family="'Noto Sans Thai','Segoe UI',sans-serif" font-size="9.5" fill="#64748B">
      <tspan x="14" dy="0">• Hash-Chained Audit Trail</tspan>
      <tspan x="14" dy="14">• Tamper-Evident Records</tspan>
      <tspan x="14" dy="14">• Forensic Proof Export</tspan>
    </text>
  </g>

  <!-- Card 3: Dual-Engine Routing -->
  <g transform="translate(424, 24)">
    <rect x="0" y="0" width="194" height="142" rx="12" fill="url(#feat-card-bg)" stroke="#15324D" stroke-width="1.2" />
    <rect x="14" y="12" width="36" height="3" rx="1.5" fill="url(#feat-blue-bar)" filter="url(#feat-glow)" />
    <!-- Glyph -->
    <g transform="translate(150, 14)">
      <circle cx="14" cy="14" r="14" fill="#0C2138" />
      <circle cx="14" cy="14" r="7" fill="none" stroke="#60A5FA" stroke-width="1.8" stroke-dasharray="14 10" />
      <circle cx="14" cy="14" r="2.5" fill="#60A5FA" />
    </g>
    <text x="14" y="38" font-family="'Segoe UI',sans-serif" font-size="9" font-weight="800" letter-spacing="1.5" fill="#60A5FA">PILLAR 03</text>
    <text x="14" y="58" font-family="'Noto Sans Thai','Segoe UI',sans-serif" font-size="13.5" font-weight="700" fill="#F1F5F9">Dual Routing</text>
    <text x="14" y="76" font-family="'Noto Sans Thai','Segoe UI',sans-serif" font-size="10" font-weight="600" fill="#94A3B8">ZYNTHEOR CORE &amp; Providers</text>
    <text x="14" y="96" font-family="'Noto Sans Thai','Segoe UI',sans-serif" font-size="9.5" fill="#64748B">
      <tspan x="14" dy="0">• First-Party ZYNTHEOR CORE</tspan>
      <tspan x="14" dy="14">• External Provider Gateway</tspan>
      <tspan x="14" dy="14">• Real Response Verification</tspan>
    </text>
  </g>

  <!-- Card 4: Governed Automation -->
  <g transform="translate(630, 24)">
    <rect x="0" y="0" width="198" height="142" rx="12" fill="url(#feat-card-bg)" stroke="#15324D" stroke-width="1.2" />
    <rect x="14" y="12" width="36" height="3" rx="1.5" fill="url(#feat-emerald-bar)" filter="url(#feat-glow)" />
    <!-- Glyph -->
    <g transform="translate(154, 14)">
      <circle cx="14" cy="14" r="14" fill="#09241B" />
      <path d="M 8 18 L 14 8 L 20 18 Z" fill="none" stroke="#34D399" stroke-width="1.4" />
      <circle cx="14" cy="15" r="1.5" fill="#34D399" />
    </g>
    <text x="14" y="38" font-family="'Segoe UI',sans-serif" font-size="9" font-weight="800" letter-spacing="1.5" fill="#34D399">PILLAR 04</text>
    <text x="14" y="58" font-family="'Noto Sans Thai','Segoe UI',sans-serif" font-size="13.5" font-weight="700" fill="#F1F5F9">Fail-Closed Gates</text>
    <text x="14" y="76" font-family="'Noto Sans Thai','Segoe UI',sans-serif" font-size="10" font-weight="600" fill="#94A3B8">Safe Execution Policy</text>
    <text x="14" y="96" font-family="'Noto Sans Thai','Segoe UI',sans-serif" font-size="9.5" fill="#64748B">
      <tspan x="14" dy="0">• Human Approval Gate</tspan>
      <tspan x="14" dy="14">• Containment Sandbox</tspan>
      <tspan x="14" dy="14">• Zero Simulated Behavior</tspan>
    </text>
  </g>
</svg>

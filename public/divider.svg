<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 12" width="840" height="12" role="presentation" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10B981" stop-opacity="0"/>
      <stop offset=".35" stop-color="#10B981"/>
      <stop offset=".65" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .seg{animation:run 4.5s linear infinite}
    @keyframes run{from{transform:translateX(-220px)}to{transform:translateX(840px)}}
    @media (prefers-reduced-motion:reduce){.seg{animation:none;transform:translateX(310px)}}
  </style>
  <rect x="0" y="5" width="840" height="2" rx="1" fill="#16324a"/>
  <rect class="seg" x="0" y="4" width="220" height="4" rx="2" fill="url(#lg)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 28" width="840" height="28" role="presentation" aria-hidden="true">
  <defs>
    <!-- Base track with smooth edge fade -->
    <linearGradient id="dv-base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0" />
      <stop offset="0.15" stop-color="#14B8A6" stop-opacity="0.3" />
      <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="0.85" stop-color="#14B8A6" stop-opacity="0.3" />
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0" />
    </linearGradient>

    <!-- Comet moving right: gradient tail to intense head -->
    <linearGradient id="dv-comet-r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10B981" stop-opacity="0" />
      <stop offset="0.6" stop-color="#2DD4BF" stop-opacity="0.85" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="1" />
    </linearGradient>

    <!-- Comet moving left -->
    <linearGradient id="dv-comet-l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="0.4" stop-color="#38BDF8" stop-opacity="0.85" />
      <stop offset="1" stop-color="#0284C7" stop-opacity="0" />
    </linearGradient>

    <!-- Edge dissolve mask -->
    <linearGradient id="dv-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0" />
      <stop offset="0.12" stop-color="#fff" stop-opacity="1" />
      <stop offset="0.88" stop-color="#fff" stop-opacity="1" />
      <stop offset="1" stop-color="#000" stop-opacity="0" />
    </linearGradient>
    <mask id="dv-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="840" height="28">
      <rect x="0" y="0" width="840" height="28" fill="url(#dv-fade)" />
    </mask>

    <radialGradient id="dv-node-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="1" />
      <stop offset="40%" stop-color="#14B8A6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0" />
    </radialGradient>

    <filter id="dv-glow" x="-10%" y="-400%" width="120%" height="900%">
      <feGaussianBlur stdDeviation="2.5" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .run-r { animation: dv-right 4.5s cubic-bezier(.4,.0,.6,1) infinite; }
    .run-l { animation: dv-left 6.2s cubic-bezier(.4,.0,.6,1) infinite; animation-delay: -2s; }
    .node  { transform-box: fill-box; transform-origin: center; animation: dv-pulse 2.2s ease-in-out infinite; }
    .tick  { animation: dv-blink 2.2s ease-in-out infinite; }
    @keyframes dv-right { from { transform: translateX(-240px); } to { transform: translateX(880px); } }
    @keyframes dv-left  { from { transform: translateX(880px); }  to { transform: translateX(-240px); } }
    @keyframes dv-pulse { 0%,100% { transform: scale(.85); opacity: .8; } 50% { transform: scale(1.2); opacity: 1; } }
    @keyframes dv-blink { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .run-r, .run-l, .node, .tick { animation: none; }
      .run-r { transform: translateX(260px); }
      .run-l { transform: translateX(520px); }
    }
  </style>

  <!-- Ambient background glow line -->
  <rect x="0" y="12" width="840" height="4" fill="url(#dv-base)" opacity="0.4" filter="url(#dv-glow)" />
  <rect x="0" y="13.25" width="840" height="1.5" rx="0.75" fill="url(#dv-base)" />

  <!-- Running photon lasers -->
  <g mask="url(#dv-mask)">
    <g class="run-r" filter="url(#dv-glow)">
      <rect x="0" y="13" width="220" height="2" rx="1" fill="url(#dv-comet-r)" />
      <circle cx="220" cy="14" r="2.8" fill="#FFFFFF" />
    </g>
    <g class="run-l" filter="url(#dv-glow)">
      <rect x="0" y="13" width="170" height="2" rx="1" fill="url(#dv-comet-l)" />
      <circle cx="0" cy="14" r="2.4" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Center Diamond Seal Node + Side Winglet Ticks -->
  <g transform="translate(420, 14)">
    <circle class="node" r="10" fill="url(#dv-node-glow)" />
    <!-- Outer Diamond -->
    <rect x="-4.5" y="-4.5" width="9" height="9" rx="1.5" transform="rotate(45)" fill="#071524" stroke="#2DD4BF" stroke-width="1.4" />
    <!-- Center Core Dot -->
    <circle r="1.5" fill="#FFFFFF" />
  </g>

  <g class="tick" fill="#2DD4BF">
    <rect x="382" y="13.25" width="14" height="1.5" rx="0.75" opacity="0.85" />
    <rect x="444" y="13.25" width="14" height="1.5" rx="0.75" opacity="0.85" />
    <circle cx="366" cy="14" r="1.5" opacity="0.7" />
    <circle cx="474" cy="14" r="1.5" opacity="0.7" />
  </g>
</svg>

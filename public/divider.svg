<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 24" width="840" height="24" role="presentation" aria-hidden="true">
  <defs>
    <!-- Base line: fades out at both ends -->
    <linearGradient id="dv-base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#14B8A6" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="0.82" stop-color="#14B8A6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </linearGradient>
    <!-- Comet heading right: transparent tail -> bright head -->
    <linearGradient id="dv-comet-r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10B981" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#2DD4BF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#E6FFFA" stop-opacity="1"/>
    </linearGradient>
    <!-- Comet heading left: bright head on the left -->
    <linearGradient id="dv-comet-l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E0F7FF" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#38BDF8" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </linearGradient>
    <!-- Edge fade so comets dissolve before the borders -->
    <linearGradient id="dv-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.88" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="dv-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="840" height="24">
      <rect x="0" y="0" width="840" height="24" fill="url(#dv-fade)"/>
    </mask>
    <radialGradient id="dv-node" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E6FFFA" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#2DD4BF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <filter id="dv-glow" x="-10%" y="-400%" width="120%" height="900%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .run-r { animation: dv-right 4.8s cubic-bezier(.45,.05,.55,.95) infinite; }
    .run-l { animation: dv-left 6.4s cubic-bezier(.45,.05,.55,.95) infinite; animation-delay: -2.4s; }
    .node  { transform-box: fill-box; transform-origin: center; animation: dv-pulse 2.4s ease-in-out infinite; }
    .tick  { animation: dv-blink 2.4s ease-in-out infinite; }
    @keyframes dv-right { from { transform: translateX(-220px); } to { transform: translateX(860px); } }
    @keyframes dv-left  { from { transform: translateX(860px); }  to { transform: translateX(-220px); } }
    @keyframes dv-pulse { 0%,100% { transform: scale(.82); opacity: .75; } 50% { transform: scale(1.18); opacity: 1; } }
    @keyframes dv-blink { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .run-r, .run-l, .node, .tick { animation: none; }
      .run-r { transform: translateX(240px); }
      .run-l { transform: translateX(440px); }
    }
  </style>

  <!-- soft glow track + crisp base line -->
  <rect x="0" y="10" width="840" height="4" fill="url(#dv-base)" opacity="0.35" filter="url(#dv-glow)"/>
  <rect x="0" y="11.25" width="840" height="1.5" rx="0.75" fill="url(#dv-base)"/>

  <!-- running comets (masked so they fade at the edges) -->
  <g mask="url(#dv-mask)">
    <g class="run-r" filter="url(#dv-glow)">
      <rect x="0" y="11" width="200" height="2" rx="1" fill="url(#dv-comet-r)"/>
      <circle cx="200" cy="12" r="2.4" fill="#E6FFFA"/>
    </g>
    <g class="run-l" filter="url(#dv-glow)">
      <rect x="0" y="11" width="150" height="2" rx="1" fill="url(#dv-comet-l)"/>
      <circle cx="0" cy="12" r="2" fill="#E0F7FF"/>
    </g>
  </g>

  <!-- center diamond node + side ticks -->
  <g transform="translate(420 12)">
    <circle class="node" r="9" fill="url(#dv-node)"/>
    <rect x="-3.6" y="-3.6" width="7.2" height="7.2" rx="1.2" transform="rotate(45)" fill="#0B1B2E" stroke="#2DD4BF" stroke-width="1.2"/>
    <circle r="1.1" fill="#E6FFFA"/>
  </g>
  <g class="tick" fill="#2DD4BF">
    <rect x="388" y="11.25" width="12" height="1.5" rx="0.75" opacity="0.8"/>
    <rect x="440" y="11.25" width="12" height="1.5" rx="0.75" opacity="0.8"/>
    <circle cx="372" cy="12" r="1.3" opacity="0.6"/>
    <circle cx="468" cy="12" r="1.3" opacity="0.6"/>
  </g>
</svg>

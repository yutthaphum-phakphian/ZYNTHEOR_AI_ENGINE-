<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72" role="img" aria-label="ZYNTHEOR Buffalo Edition Mark">
  <defs>
    <!-- Horn Gradients -->
    <linearGradient id="horn-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <linearGradient id="horn-r" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Face Plate Gradient -->
    <linearGradient id="face-plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F243A" />
      <stop offset="50%" stop-color="#0A1828" />
      <stop offset="100%" stop-color="#06101D" />
    </linearGradient>

    <!-- Crown Crest Gradient -->
    <linearGradient id="crest-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagonal Dark Badge Background -->
  <polygon points="36,2 66,19 66,53 36,70 6,53 6,19" fill="#081322" stroke="#163654" stroke-width="1.5" />
  <polygon points="36,6 62,21 62,51 36,66 10,51 10,21" fill="#0A1A2E" stroke="#13425E" stroke-width="0.8" opacity="0.6" />

  <!-- Left Cyber Horn -->
  <path d="M 22 25 L 10 10 L 16 12 L 27 23 Z" fill="url(#horn-l)" filter="url(#soft-glow)" />
  <path d="M 12 11 L 18 16 L 24 23 Z" fill="#2DD4BF" opacity="0.7" />

  <!-- Right Cyber Horn -->
  <path d="M 50 25 L 62 10 L 56 12 L 45 23 Z" fill="url(#horn-r)" filter="url(#soft-glow)" />
  <path d="M 60 11 L 54 16 L 48 23 Z" fill="#2DD4BF" opacity="0.7" />

  <!-- Head Chassis Structure -->
  <polygon points="36,18 52,27 49,46 36,58 23,46 20,27" fill="url(#face-plate)" stroke="#164E63" stroke-width="1.4" />

  <!-- Top Crown Brow Crest -->
  <polygon points="36,20 46,26 42,30 36,26 30,30 26,26" fill="url(#crest-grad)" opacity="0.9" />

  <!-- Inner Angular Visor Plate -->
  <polygon points="36,30 44,34 43,43 36,49 29,43 28,34" fill="#050C16" stroke="#2DD4BF" stroke-width="0.9" />

  <!-- High-Precision Luminous Sensor Eyes -->
  <circle cx="31" cy="37" r="2.2" fill="#38BDF8" filter="url(#soft-glow)" />
  <circle cx="41" cy="37" r="2.2" fill="#38BDF8" filter="url(#soft-glow)" />
  <circle cx="31" cy="37" r="1" fill="#FFFFFF" />
  <circle cx="41" cy="37" r="1" fill="#FFFFFF" />

  <!-- Core Forensic Node (Chin Indicator) -->
  <polygon points="36,44 38,47 36,50 34,47" fill="#10B981" filter="url(#soft-glow)" />
  <circle cx="36" cy="47" r="0.8" fill="#FFFFFF" />

  <!-- Subtle Cyan Arc Trace Under Brow -->
  <path d="M 23 27 Q 36 22 49 27" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.7" />
</svg>

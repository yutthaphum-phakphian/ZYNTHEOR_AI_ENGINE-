<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400" role="img" aria-label="ZYNTHEOR AI ENGINE Multi-Tier Sovereign Architecture">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="arch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060C16" />
      <stop offset="50%" stop-color="#0A1626" />
      <stop offset="100%" stop-color="#050A14" />
    </linearGradient>

    <!-- Layer Cards Gradients -->
    <linearGradient id="layer-card-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D2035" />
      <stop offset="100%" stop-color="#081423" />
    </linearGradient>

    <linearGradient id="layer-card-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2A38" />
      <stop offset="100%" stop-color="#061A24" />
    </linearGradient>

    <linearGradient id="layer-card-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102540" />
      <stop offset="100%" stop-color="#081526" />
    </linearGradient>

    <linearGradient id="layer-card-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2B28" />
      <stop offset="100%" stop-color="#061B19" />
    </linearGradient>

    <linearGradient id="flow-line-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Filters -->
    <filter id="arch-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="arch-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#102336" stroke-width="0.7" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    @keyframes pulse-flow {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }
    .flow-bus {
      stroke-dasharray: 8 12;
      animation: pulse-flow 3.5s linear infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .flow-bus { animation: none; stroke-dasharray: none; }
    }
  </style>

  <!-- Container Box -->
  <rect x="4" y="4" width="832" height="392" rx="18" fill="url(#arch-bg)" stroke="#163450" stroke-width="1.5" />
  <rect x="4" y="4" width="832" height="392" rx="18" fill="url(#arch-grid)" />

  <!-- Header Section -->
  <g transform="translate(32, 28)">
    <text x="0" y="20" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="18" font-weight="800" letter-spacing="3" fill="#2DD4BF">ZYNTHEOR SOVEREIGN ARCHITECTURE</text>
    <text x="0" y="38" font-family="'Noto Sans Thai','Segoe UI',sans-serif" font-size="11" fill="#94A3B8">สถาปัตยกรรม 4 ลำดับชั้น: Client UI → Express Gateway → Dual-Inference Core → Cryptographic Audit</text>
    <line x1="0" y1="50" x2="776" y2="50" stroke="#132B42" stroke-width="1" />
  </g>

  <!-- Animated Data Flow Traces Behind Cards -->
  <g fill="none" stroke="url(#flow-line-glow)" stroke-width="2" class="flow-bus" filter="url(#arch-glow)" opacity="0.85">
    <path d="M 216 160 L 236 160" />
    <path d="M 420 160 L 440 160" />
    <path d="M 624 160 L 644 160" />
    <!-- Feedback / Validation Loop Trace -->
    <path d="M 730 260 L 730 330 L 120 330 L 120 260" stroke="#14B8A6" opacity="0.6" />
  </g>

  <!-- 4 Architectural Tier Cards (840 width, 184 width each, 20 gap) -->

  <!-- Tier 1: Client Layer -->
  <g transform="translate(32, 95)">
    <rect x="0" y="0" width="184" height="215" rx="14" fill="url(#layer-card-1)" stroke="#193D60" stroke-width="1.3" />
    <rect x="14" y="14" width="34" height="3" rx="1.5" fill="#38BDF8" filter="url(#arch-glow)" />
    <text x="14" y="36" font-family="'Segoe UI',sans-serif" font-size="9" font-weight="800" letter-spacing="1.5" fill="#38BDF8">TIER 01</text>
    <text x="14" y="58" font-family="'Space Grotesk',sans-serif" font-size="14.5" font-weight="700" fill="#F8FAFC">Client Interface</text>
    <text x="14" y="76" font-family="'Segoe UI',sans-serif" font-size="10" font-weight="600" fill="#94A3B8">React 19 SPA · Vite 6</text>

    <!-- Sub-items -->
    <g transform="translate(12, 92)">
      <rect x="0" y="0" width="160" height="24" rx="6" fill="#071322" stroke="#142C44" stroke-width="0.8" />
      <text x="10" y="16" font-family="'Segoe UI',sans-serif" font-size="10" fill="#E2E8F0">⚡ Multi-Workspace Hub</text>

      <rect x="0" y="29" width="160" height="24" rx="6" fill="#071322" stroke="#142C44" stroke-width="0.8" />
      <text x="10" y="45" font-family="'Segoe UI',sans-serif" font-size="10" fill="#E2E8F0">📊 Recharts &amp; D3 Analytics</text>

      <rect x="0" y="58" width="160" height="24" rx="6" fill="#071322" stroke="#142C44" stroke-width="0.8" />
      <text x="10" y="74" font-family="'Segoe UI',sans-serif" font-size="10" fill="#E2E8F0">🛡️ Prompt Forge &amp; TestLab</text>

      <rect x="0" y="87" width="160" height="24" rx="6" fill="#071322" stroke="#142C44" stroke-width="0.8" />
      <text x="10" y="103" font-family="'Segoe UI',sans-serif" font-size="10" fill="#E2E8F0">🔐 AuthGate RBAC UI</text>
    </g>
  </g>

  <!-- Tier 2: Backend Control Gateway -->
  <g transform="translate(236, 95)">
    <rect x="0" y="0" width="184" height="215" rx="14" fill="url(#layer-card-2)" stroke="#164A5E" stroke-width="1.3" />
    <rect x="14" y="14" width="34" height="3" rx="1.5" fill="#2DD4BF" filter="url(#arch-glow)" />
    <text x="14" y="36" font-family="'Segoe UI',sans-serif" font-size="9" font-weight="800" letter-spacing="1.5" fill="#2DD4BF">TIER 02</text>
    <text x="14" y="58" font-family="'Space Grotesk',sans-serif" font-size="14.5" font-weight="700" fill="#F8FAFC">Server Gateway</text>
    <text x="14" y="76" font-family="'Segoe UI',sans-serif" font-size="10" font-weight="600" fill="#94A3B8">Express 5 · Node 22</text>

    <!-- Sub-items -->
    <g transform="translate(12, 92)">
      <rect x="0" y="0" width="160" height="24" rx="6" fill="#051722" stroke="#0F3847" stroke-width="0.8" />
      <text x="10" y="16" font-family="'Segoe UI',sans-serif" font-size="10" fill="#E2E8F0">🔒 Fail-Closed Proxy</text>

      <rect x="0" y="29" width="160" height="24" rx="6" fill="#051722" stroke="#0F3847" stroke-width="0.8" />
      <text x="10" y="45" font-family="'Segoe UI',sans-serif" font-size="10" fill="#E2E8F0">🚦 Local-Only Enforcement</text>

      <rect x="0" y="58" width="160" height="24" rx="6" fill="#051722" stroke="#0F3847" stroke-width="0.8" />
      <text x="10" y="74" font-family="'Segoe UI',sans-serif" font-size="10" fill="#E2E8F0">🏢 Multi-Tenant Middleware</text>

      <rect x="0" y="87" width="160" height="24" rx="6" fill="#051722" stroke="#0F3847" stroke-width="0.8" />
      <text x="10" y="103" font-family="'Segoe UI',sans-serif" font-size="10" fill="#E2E8F0">⚡ SSE Real-Time Stream</text>
    </g>
  </g>

  <!-- Tier 3: Dual Intelligence Engine -->
  <g transform="translate(440, 95)">
    <rect x="0" y="0" width="184" height="215" rx="14" fill="url(#layer-card-3)" stroke="#193B66" stroke-width="1.3" />
    <rect x="14" y="14" width="34" height="3" rx="1.5" fill="#60A5FA" filter="url(#arch-glow)" />
    <text x="14" y="36" font-family="'Segoe UI',sans-serif" font-size="9" font-weight="800" letter-spacing="1.5" fill="#60A5FA">TIER 03</text>
    <text x="14" y="58" font-family="'Space Grotesk',sans-serif" font-size="14.5" font-weight="700" fill="#F8FAFC">Inference Core</text>
    <text x="14" y="76" font-family="'Segoe UI',sans-serif" font-size="10" font-weight="600" fill="#94A3B8">Dual Engine · Routing</text>

    <!-- Sub-items -->
    <g transform="translate(12, 92)">
      <rect x="0" y="0" width="160" height="24" rx="6" fill="#071526" stroke="#123052" stroke-width="0.8" />
      <text x="10" y="16" font-family="'Segoe UI',sans-serif" font-size="10" fill="#E2E8F0">🦬 Ollama Local Inference</text>

      <rect x="0" y="29" width="160" height="24" rx="6" fill="#071526" stroke="#123052" stroke-width="0.8" />
      <text x="10" y="45" font-family="'Segoe UI',sans-serif" font-size="10" fill="#E2E8F0">☁️ External Provider Proxy</text>

      <rect x="0" y="58" width="160" height="24" rx="6" fill="#071526" stroke="#123052" stroke-width="0.8" />
      <text x="10" y="74" font-family="'Segoe UI',sans-serif" font-size="10" fill="#E2E8F0">🧠 Cognitive Reasoning</text>

      <rect x="0" y="87" width="160" height="24" rx="6" fill="#071526" stroke="#123052" stroke-width="0.8" />
      <text x="10" y="103" font-family="'Segoe UI',sans-serif" font-size="10" fill="#E2E8F0">🔍 AST &amp; Code Graph</text>
    </g>
  </g>

  <!-- Tier 4: Sovereign Trust & Ledger -->
  <g transform="translate(644, 95)">
    <rect x="0" y="0" width="164" height="215" rx="14" fill="url(#layer-card-4)" stroke="#144C43" stroke-width="1.3" />
    <rect x="14" y="14" width="34" height="3" rx="1.5" fill="#34D399" filter="url(#arch-glow)" />
    <text x="14" y="36" font-family="'Segoe UI',sans-serif" font-size="9" font-weight="800" letter-spacing="1.5" fill="#34D399">TIER 04</text>
    <text x="14" y="58" font-family="'Space Grotesk',sans-serif" font-size="14.5" font-weight="700" fill="#F8FAFC">Trust &amp; Audit</text>
    <text x="14" y="76" font-family="'Segoe UI',sans-serif" font-size="10" font-weight="600" fill="#94A3B8">SHA-256 · Postgres</text>

    <!-- Sub-items -->
    <g transform="translate(12, 92)">
      <rect x="0" y="0" width="140" height="24" rx="6" fill="#061816" stroke="#0F3832" stroke-width="0.8" />
      <text x="10" y="16" font-family="'Segoe UI',sans-serif" font-size="10" fill="#E2E8F0">⛓️ Cryptographic Chain</text>

      <rect x="0" y="29" width="140" height="24" rx="6" fill="#061816" stroke="#0F3832" stroke-width="0.8" />
      <text x="10" y="45" font-family="'Segoe UI',sans-serif" font-size="10" fill="#E2E8F0">🗄️ Drizzle ORM Storage</text>

      <rect x="0" y="58" width="140" height="24" rx="6" fill="#061816" stroke="#0F3832" stroke-width="0.8" />
      <text x="10" y="74" font-family="'Segoe UI',sans-serif" font-size="10" fill="#E2E8F0">📜 Human Approval Gate</text>

      <rect x="0" y="87" width="140" height="24" rx="6" fill="#061816" stroke="#0F3832" stroke-width="0.8" />
      <text x="10" y="103" font-family="'Segoe UI',sans-serif" font-size="10" fill="#E2E8F0">🔬 Forensic Export</text>
    </g>
  </g>

  <!-- Bottom Legend Bar -->
  <g transform="translate(32, 345)">
    <circle cx="8" cy="12" r="4" fill="#10B981" />
    <text x="20" y="16" font-family="'Segoe UI',sans-serif" font-size="10" fill="#94A3B8">Fail-Closed Boundary</text>

    <circle cx="160" cy="12" r="4" fill="#38BDF8" />
    <text x="172" y="16" font-family="'Segoe UI',sans-serif" font-size="10" fill="#94A3B8">Bi-directional Secure Streaming</text>

    <circle cx="370" cy="12" r="4" fill="#2DD4BF" />
    <text x="382" y="16" font-family="'Segoe UI',sans-serif" font-size="10" fill="#94A3B8">SHA-256 Verifiable Hash Chain</text>

    <text x="776" y="16" text-anchor="end" font-family="'Segoe UI',sans-serif" font-size="10" font-weight="700" fill="#64748B">ZYNTHEOR CORE X COMPLIANT</text>
  </g>

  <!-- zy-laser:start -->
  <style>
    @keyframes zy-lz  { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    @keyframes zy-lzr { from { stroke-dashoffset: 0; }   to { stroke-dashoffset: 100; } }
    .zy-lz  { stroke-dasharray: 14 86; animation: zy-lz 6s linear infinite; }
    .zy-lzr { stroke-dasharray: 9 91;  animation: zy-lzr 8s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .zy-lz, .zy-lzr { animation: none; } }
  </style>
  <defs>
    <linearGradient id="zy-laser-g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#10B981"/><stop offset="0.5" stop-color="#2DD4BF"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
    <filter id="zy-laser-f" filterUnits="userSpaceOnUse" x="-20" y="-20" width="880" height="440"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="4" y="4" width="832" height="392" rx="18" fill="none" stroke-linecap="round" pathLength="100" stroke="url(#zy-laser-g)" stroke-width="2.4" class="zy-lz" style="animation-delay:0s" filter="url(#zy-laser-f)"/>
    <rect x="4" y="4" width="832" height="392" rx="18" fill="none" stroke-linecap="round" pathLength="100" stroke="#38BDF8" stroke-width="1.68" class="zy-lzr" style="animation-delay:0s" filter="url(#zy-laser-f)"/>
  <!-- zy-laser:end -->
</svg>

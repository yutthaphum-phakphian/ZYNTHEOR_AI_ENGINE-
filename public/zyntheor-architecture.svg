<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" width="840" height="420" role="img" aria-label="ZYNTHEOR AI ENGINE System Architecture">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03070E"/>
      <stop offset="50%" stop-color="#081422"/>
      <stop offset="100%" stop-color="#050D16"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1524"/>
      <stop offset="100%" stop-color="#071018"/>
    </linearGradient>
    <linearGradient id="core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D2E2B"/>
      <stop offset="100%" stop-color="#0A1F28"/>
    </linearGradient>
    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="50%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
    <filter id="g" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#0F3D3A" stroke-width="0.5" stroke-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="840" height="420" rx="18" fill="url(#bg)"/>
  <rect width="840" height="420" rx="18" fill="url(#grid)"/>

  <!-- Top flowing accent -->
  <path d="M 0 14 C 100 6, 200 22, 320 10 S 520 4, 640 16 S 760 24, 840 8"
        fill="none" stroke="url(#flow)" stroke-width="1.6" opacity="0.55" filter="url(#g)"/>

  <!-- Header -->
  <text x="28" y="42" font-family="system-ui,sans-serif" font-size="15" font-weight="700" letter-spacing="2.5" fill="url(#titleGrad)">SYSTEM ARCHITECTURE</text>
  <text x="28" y="60" font-family="system-ui,sans-serif" font-size="11" fill="#64748B">ZYNTHEOR CORE X · Evidence-Based Sovereign Workspace</text>

  <!-- Small buffalo mark top-right -->
  <g transform="translate(770, 22) scale(0.55)">
    <path d="M18 22 L8 8 L14 10 L22 20 Z" fill="#14B8A6" opacity="0.9"/>
    <path d="M46 22 L56 8 L50 10 L42 20 Z" fill="#14B8A6" opacity="0.9"/>
    <path d="M20 24 L32 18 L44 24 L46 38 L32 48 L18 38 Z" fill="#0D9488" stroke="#134E4A" stroke-width="1"/>
    <circle cx="27" cy="32" r="1.6" fill="#5EEAD4"/>
    <circle cx="37" cy="32" r="1.6" fill="#5EEAD4"/>
  </g>

  <!-- ========== CENTER: CORE X ========== -->
  <g transform="translate(280, 85)">
    <rect width="280" height="70" rx="14" fill="url(#core)" stroke="#0D9488" stroke-width="1.6"/>
    <text x="140" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#5EEAD4">ZYNTHEOR CORE X</text>
    <text x="140" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#94A3B8">Governed Intelligence Runtime</text>
  </g>

  <!-- Connecting lines from CORE to layers -->
  <path d="M 420 155 L 420 175" stroke="#14B8A6" stroke-width="1.4" opacity="0.6"/>
  <path d="M 200 220 L 280 155" stroke="#0D9488" stroke-width="1.2" opacity="0.4" stroke-dasharray="4 4"/>
  <path d="M 640 220 L 560 155" stroke="#0D9488" stroke-width="1.2" opacity="0.4" stroke-dasharray="4 4"/>

  <!-- ========== ROW 1: Intelligence + Memory + Agents ========== -->
  <!-- Intelligence & Reasoning -->
  <g transform="translate(28, 185)">
    <rect width="240" height="78" rx="12" fill="url(#card)" stroke="#134E4A" stroke-width="1.2"/>
    <rect x="12" y="12" width="28" height="3" rx="1.5" fill="#0D9488"/>
    <text x="12" y="38" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">Intelligence &amp; Reasoning</text>
    <text x="12" y="56" font-family="system-ui,sans-serif" font-size="11" fill="#64748B">Cognitive foundations · P11</text>
  </g>

  <!-- Memory System -->
  <g transform="translate(300, 185)">
    <rect width="240" height="78" rx="12" fill="url(#card)" stroke="#134E4A" stroke-width="1.2"/>
    <rect x="12" y="12" width="28" height="3" rx="1.5" fill="#14B8A6"/>
    <text x="12" y="38" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">Memory System</text>
    <text x="12" y="56" font-family="system-ui,sans-serif" font-size="11" fill="#64748B">Persistent · Tenant-boundary · P12</text>
  </g>

  <!-- Agent Orchestration -->
  <g transform="translate(572, 185)">
    <rect width="240" height="78" rx="12" fill="url(#card)" stroke="#134E4A" stroke-width="1.2"/>
    <rect x="12" y="12" width="28" height="3" rx="1.5" fill="#22D3EE"/>
    <text x="12" y="38" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">Agent Orchestration</text>
    <text x="12" y="56" font-family="system-ui,sans-serif" font-size="11" fill="#64748B">Coordinator foundations · P13</text>
  </g>

  <!-- ========== ROW 2: Gateway + Sandbox + Evaluation ========== -->
  <!-- Execution Gateway -->
  <g transform="translate(28, 285)">
    <rect width="240" height="78" rx="12" fill="url(#card)" stroke="#134E4A" stroke-width="1.2"/>
    <rect x="12" y="12" width="28" height="3" rx="1.5" fill="#0D9488"/>
    <text x="12" y="38" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">Execution Gateway</text>
    <text x="12" y="56" font-family="system-ui,sans-serif" font-size="11" fill="#64748B">Express 5 · Local Ollama / Gemini</text>
  </g>

  <!-- Sovereign Sandbox -->
  <g transform="translate(300, 285)">
    <rect width="240" height="78" rx="12" fill="url(#card)" stroke="#134E4A" stroke-width="1.2"/>
    <rect x="12" y="12" width="28" height="3" rx="1.5" fill="#14B8A6"/>
    <text x="12" y="38" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">Sovereign Sandbox</text>
    <text x="12" y="56" font-family="system-ui,sans-serif" font-size="11" fill="#64748B">Local-only policy · Isolation · P19</text>
  </g>

  <!-- Evaluation & Audit -->
  <g transform="translate(572, 285)">
    <rect width="240" height="78" rx="12" fill="url(#card)" stroke="#134E4A" stroke-width="1.2"/>
    <rect x="12" y="12" width="28" height="3" rx="1.5" fill="#22D3EE"/>
    <text x="12" y="38" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">Evaluation &amp; Audit</text>
    <text x="12" y="56" font-family="system-ui,sans-serif" font-size="11" fill="#64748B">Evidence gates · Hash-chained · P14</text>
  </g>

  <!-- Bottom note -->
  <text x="420" y="400" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#475569">
    Foundations present · Acceptance evidence tracked separately · P11–P20 status remains evidence-driven
  </text>
</svg>

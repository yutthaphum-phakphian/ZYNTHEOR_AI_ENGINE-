<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" width="840" height="280" role="img" aria-label="ZYNTHEOR AI ENGINE - Sovereign Local-First Intelligence &amp; Autonomous Engineering Core">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hdr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060C16" />
      <stop offset="45%" stop-color="#0A1424" />
      <stop offset="100%" stop-color="#080F1B" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="teal-cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="text-title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="40%" stop-color="#2DD4BF" />
      <stop offset="80%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <linearGradient id="badge-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2438" />
      <stop offset="100%" stop-color="#0A1624" />
    </linearGradient>

    <!-- Cyber Matrix Grid Pattern -->
    <pattern id="hdr-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#132338" stroke-width="0.8" stroke-opacity="0.45" />
      <circle cx="0" cy="0" r="1" fill="#14B8A6" fill-opacity="0.3" />
    </pattern>

    <!-- Laser & Glow Filters -->
    <filter id="hdr-neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="hdr-subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="hdr-clip">
      <rect x="4" y="4" width="832" height="272" rx="18" />
    </clipPath>
  </defs>

  <style>
    @keyframes scan-track {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes core-pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.06); opacity: 1; }
    }
    @keyframes node-blink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.95; }
    }
    @keyframes wave-float {
      0% { transform: translateX(0); }
      100% { transform: translateX(-420px); }
    }
    .track-anim {
      stroke-dasharray: 60 340;
      animation: scan-track 7s linear infinite;
    }
    .track-anim-rev {
      stroke-dasharray: 40 360;
      animation: scan-track 9s linear infinite reverse;
    }
    .pulse-node {
      animation: node-blink 3s ease-in-out infinite;
    }
    .wave-slide {
      animation: wave-float 14s linear infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .track-anim, .track-anim-rev, .pulse-node, .wave-slide {
        animation: none;
      }
    }
  </style>

  <!-- Card Background Container -->
  <rect x="4" y="4" width="832" height="272" rx="18" fill="url(#hdr-bg)" stroke="#162E48" stroke-width="1.5" />

  <!-- Clipped Interior with Grid and Geometric Waves -->
  <g clip-path="url(#hdr-clip)">
    <!-- Circuit Grid -->
    <rect x="4" y="4" width="832" height="272" fill="url(#hdr-grid)" />

    <!-- Ambient Glow Orbs -->
    <circle cx="210" cy="50" r="140" fill="#14B8A6" fill-opacity="0.06" filter="url(#hdr-neon)" />
    <circle cx="630" cy="70" r="160" fill="#38BDF8" fill-opacity="0.05" filter="url(#hdr-neon)" />
    <circle cx="420" cy="140" r="180" fill="#10B981" fill-opacity="0.04" filter="url(#hdr-neon)" />

    <!-- Isometric Circuit Traces Left -->
    <path d="M 30 50 L 120 50 L 160 90 L 220 90" fill="none" stroke="#163C5A" stroke-width="1.2" stroke-dasharray="4 4" />
    <circle cx="30" cy="50" r="2.5" fill="#38BDF8" />
    <circle cx="220" cy="90" r="3" fill="#10B981" class="pulse-node" />

    <path d="M 60 190 L 140 190 L 170 160 L 210 160" fill="none" stroke="#163C5A" stroke-width="1.2" stroke-dasharray="4 4" />
    <circle cx="60" cy="190" r="2.5" fill="#14B8A6" />
    <circle cx="210" cy="160" r="3" fill="#38BDF8" class="pulse-node" />

    <!-- Isometric Circuit Traces Right -->
    <path d="M 810 50 L 720 50 L 680 90 L 620 90" fill="none" stroke="#163C5A" stroke-width="1.2" stroke-dasharray="4 4" />
    <circle cx="810" cy="50" r="2.5" fill="#10B981" />
    <circle cx="620" cy="90" r="3" fill="#38BDF8" class="pulse-node" />

    <path d="M 780 190 L 700 190 L 670 160 L 630 160" fill="none" stroke="#163C5A" stroke-width="1.2" stroke-dasharray="4 4" />
    <circle cx="780" cy="190" r="2.5" fill="#38BDF8" />
    <circle cx="630" cy="160" r="3" fill="#14B8A6" class="pulse-node" />

    <!-- Wave Horizon Bottom -->
    <g class="wave-slide" fill="none" stroke="#14B8A6" stroke-opacity="0.18" stroke-width="1.5">
      <path d="M 0 255 Q 105 235 210 255 T 420 255 T 630 255 T 840 255 T 1050 255 T 1260 255 V 280 H 0 Z" fill="#10B981" fill-opacity="0.04" />
    </g>
  </g>

  <!-- Central Hexagonal Neural Shield Icon -->
  <g transform="translate(420, 52)">
    <!-- Hexagon Outer Ring -->
    <polygon points="0,-26 22.5,-13 22.5,13 0,26 -22.5,13 -22.5,-13" fill="#0C1B2E" stroke="#14B8A6" stroke-width="1.8" filter="url(#hdr-subtle-glow)" />
    <!-- Hexagon Inner Lattice -->
    <polygon points="0,-17 14.7,-8.5 14.7,8.5 0,17 -14.7,8.5 -14.7,-8.5" fill="#081422" stroke="#38BDF8" stroke-width="1.2" />
    <!-- Center Core Dot & Sparks -->
    <circle cx="0" cy="0" r="4.5" fill="#10B981" filter="url(#hdr-neon)" />
    <line x1="0" y1="-17" x2="0" y2="17" stroke="#2DD4BF" stroke-width="0.8" stroke-opacity="0.6" />
    <line x1="-14.7" y1="-8.5" x2="14.7" y2="8.5" stroke="#2DD4BF" stroke-width="0.8" stroke-opacity="0.6" />
    <line x1="-14.7" y1="8.5" x2="14.7" y2="-8.5" stroke="#2DD4BF" stroke-width="0.8" stroke-opacity="0.6" />
  </g>

  <!-- Main Title: ZYNTHEOR -->
  <text x="420" y="128" text-anchor="middle" font-family="'Noto Sans Thai','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif" font-size="52" font-weight="900" letter-spacing="8" fill="url(#text-title-grad)" filter="url(#hdr-subtle-glow)">ZYNTHEOR</text>

  <!-- Subtitle: AI ENGINE -->
  <text x="420" y="160" text-anchor="middle" font-family="'Noto Sans Thai','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif" font-size="16" font-weight="700" letter-spacing="14" fill="#E2E8F0">AI ENGINE</text>

  <!-- Tagline: Sovereign Intelligence -->
  <text x="420" y="186" text-anchor="middle" font-family="'Noto Sans Thai','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif" font-size="12" font-weight="500" letter-spacing="2.5" fill="#2DD4BF">SOVEREIGN LOCAL-FIRST INTELLIGENCE &amp; AUTONOMOUS ENGINEERING CORE</text>

  <!-- Bottom Cyber Badges Row -->
  <g transform="translate(68, 212)">
    <!-- Badge 1: Local Loopback -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="162" height="30" rx="8" fill="url(#badge-glow)" stroke="#1E3A58" stroke-width="1.2" />
      <circle cx="16" cy="15" r="4" fill="#10B981" />
      <text x="28" y="19" font-family="'Noto Sans Thai','Segoe UI',sans-serif" font-size="9.5" font-weight="700" letter-spacing="1" fill="#94A3B8">LOCAL-ONLY (127.0.0.1)</text>
    </g>

    <!-- Badge 2: Cryptographic Ledger -->
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="168" height="30" rx="8" fill="url(#badge-glow)" stroke="#1E3A58" stroke-width="1.2" />
      <circle cx="16" cy="15" r="4" fill="#38BDF8" />
      <text x="28" y="19" font-family="'Noto Sans Thai','Segoe UI',sans-serif" font-size="9.5" font-weight="700" letter-spacing="1" fill="#94A3B8">SHA-256 HASH CHAIN</text>
    </g>

    <!-- Badge 3: Visual Analytics -->
    <g transform="translate(366, 0)">
      <rect x="0" y="0" width="162" height="30" rx="8" fill="url(#badge-glow)" stroke="#1E3A58" stroke-width="1.2" />
      <circle cx="16" cy="15" r="4" fill="#14B8A6" />
      <text x="28" y="19" font-family="'Noto Sans Thai','Segoe UI',sans-serif" font-size="9.5" font-weight="700" letter-spacing="1" fill="#94A3B8">RECHARTS &amp; D3 AST MAP</text>
    </g>

    <!-- Badge 4: Dual AI Gateway -->
    <g transform="translate(546, 0)">
      <rect x="0" y="0" width="158" height="30" rx="8" fill="url(#badge-glow)" stroke="#1E3A58" stroke-width="1.2" />
      <circle cx="16" cy="15" r="4" fill="#34D399" />
      <text x="28" y="19" font-family="'Noto Sans Thai','Segoe UI',sans-serif" font-size="9.5" font-weight="700" letter-spacing="1" fill="#94A3B8">OLLAMA ⇄ GEMINI CORE</text>
    </g>
  </g>

  <!-- Outer Animated Cyber Laser Borders -->
  <rect x="4" y="4" width="832" height="272" rx="18" fill="none" stroke="url(#teal-cyan-glow)" stroke-width="2.5" stroke-linecap="round" pathLength="400" class="track-anim" filter="url(#hdr-neon)" />
  <rect x="4" y="4" width="832" height="272" rx="18" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" pathLength="400" class="track-anim-rev" filter="url(#hdr-neon)" />
</svg>

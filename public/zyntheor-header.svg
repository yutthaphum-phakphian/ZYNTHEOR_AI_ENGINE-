<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" width="840" height="280" role="img" aria-label="ZYNTHEOR AI ENGINE - Sovereign Local-First Intelligence &amp; Autonomous Engineering Core">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hdr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060C16" />
      <stop offset="45%" stop-color="#0A1424" />
      <stop offset="100%" stop-color="#080F1B" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="teal-cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="text-title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="35%" stop-color="#2DD4BF" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <linearGradient id="badge-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2438" />
      <stop offset="100%" stop-color="#0A1624" />
    </linearGradient>

    <linearGradient id="horn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="60%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Cyber Matrix Grid Pattern -->
    <pattern id="hdr-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#132338" stroke-width="0.8" stroke-opacity="0.45" />
      <circle cx="0" cy="0" r="1" fill="#14B8A6" fill-opacity="0.3" />
    </pattern>

    <!-- Laser & Glow Filters -->
    <filter id="hdr-neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="hdr-subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="hdr-clip">
      <rect x="4" y="4" width="832" height="272" rx="18" />
    </clipPath>
  </defs>

  <style>
    @keyframes scan-track {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 0.3; r: 2px; }
      50% { opacity: 1; r: 3.5px; }
    }
    .laser-stroke {
      stroke-dasharray: 60 140;
      animation: scan-track 5s linear infinite;
    }
    .pulsing-node {
      animation: pulse-dot 2.5s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .laser-stroke { animation: none; stroke-dasharray: none; }
      .pulsing-node { animation: none; opacity: 0.8; }
    }
  </style>

  <!-- Outer Rounded Shell with Glass Effect -->
  <rect x="4" y="4" width="832" height="272" rx="18" fill="url(#hdr-bg)" stroke="#16324D" stroke-width="1.5" />

  <!-- Inside Clipped Area -->
  <g clip-path="url(#hdr-clip)">
    <!-- Tech Grid Background -->
    <rect x="4" y="4" width="832" height="272" fill="url(#hdr-grid)" />

    <!-- Ambient Glow Orbs -->
    <circle cx="120" cy="140" r="130" fill="#14B8A6" fill-opacity="0.12" filter="url(#hdr-neon)" />
    <circle cx="720" cy="90" r="110" fill="#38BDF8" fill-opacity="0.08" filter="url(#hdr-neon)" />

    <!-- Cyber Circuit Nodes & Connecting Traces -->
    <g stroke="#163952" stroke-width="1.2" fill="none" opacity="0.65">
      <path d="M 40 40 L 140 40 L 180 80 L 290 80" />
      <path d="M 40 240 L 120 240 L 160 200 L 310 200" />
      <path d="M 540 50 L 640 50 L 680 90 L 800 90" />
      <path d="M 520 230 L 620 230 L 670 180 L 800 180" />
      <line x1="720" y1="90" x2="720" y2="150" stroke-dasharray="3 3" />
      <line x1="140" y1="40" x2="140" y2="100" stroke-dasharray="3 3" />
    </g>

    <!-- Circuit Connection Nodes -->
    <circle cx="140" cy="40" r="2.5" fill="#14B8A6" class="pulsing-node" />
    <circle cx="180" cy="80" r="2.5" fill="#38BDF8" class="pulsing-node" />
    <circle cx="160" cy="200" r="2.5" fill="#10B981" class="pulsing-node" />
    <circle cx="680" cy="90" r="2.5" fill="#38BDF8" class="pulsing-node" />
    <circle cx="670" cy="180" r="2.5" fill="#2DD4BF" class="pulsing-node" />

    <!-- Center Hero Shield & Buffalo Emblem -->
    <g transform="translate(85, 138)">
      <!-- Outer Hex Shield -->
      <polygon points="0,-68 56,-34 56,34 0,68 -56,34 -56,-34" fill="#091829" stroke="#163C59" stroke-width="1.8" />
      <!-- Inner Glowing Hex -->
      <polygon points="0,-58 48,-29 48,29 0,58 -48,29 -48,-29" fill="#0C2034" stroke="#14B8A6" stroke-width="1.4" opacity="0.85" filter="url(#hdr-subtle-glow)" />

      <!-- Minimal Geometric Buffalo / Core Emblem -->
      <!-- Horns -->
      <path d="M -32,-18 L -52,-48 L -42,-44 L -24,-24 Z" fill="url(#horn-grad)" filter="url(#hdr-subtle-glow)" />
      <path d="M 32,-18 L 52,-48 L 42,-44 L 24,-24 Z" fill="url(#horn-grad)" filter="url(#hdr-subtle-glow)" />

      <!-- Face Shield Structure -->
      <polygon points="0,-28 26,-12 28,18 0,38 -28,18 -26,-12" fill="#071524" stroke="#2DD4BF" stroke-width="1.6" />
      <polygon points="0,-16 16,-6 16,12 0,24 -16,12 -16,-6" fill="#0E2D42" stroke="#38BDF8" stroke-width="1" />

      <!-- Luminous Eyes -->
      <circle cx="-9" cy="0" r="2.8" fill="#5EEAD4" filter="url(#hdr-subtle-glow)" />
      <circle cx="9" cy="0" r="2.8" fill="#5EEAD4" filter="url(#hdr-subtle-glow)" />
      <circle cx="-9" cy="0" r="1.2" fill="#FFFFFF" />
      <circle cx="9" cy="0" r="1.2" fill="#FFFFFF" />

      <!-- Forensic Core Crystal -->
      <polygon points="0,6 6,14 0,22 -6,14" fill="#38BDF8" opacity="0.9" filter="url(#hdr-subtle-glow)" />
    </g>

    <!-- Main Typography & Brand Core Content -->
    <g transform="translate(180, 0)">
      <!-- Top Badges / Pill Tags -->
      <g transform="translate(0, 50)">
        <!-- Sovereign Edition Badge -->
        <g>
          <rect x="0" y="0" width="138" height="22" rx="11" fill="url(#badge-glow)" stroke="#164E63" stroke-width="1" />
          <circle cx="11" cy="11" r="3.5" fill="#10B981" />
          <text x="21" y="14.5" font-family="'Segoe UI',sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.5" fill="#5EEAD4">BUFFALO EDITION</text>
        </g>
        <!-- Architecture Version Badge -->
        <g transform="translate(148, 0)">
          <rect x="0" y="0" width="148" height="22" rx="11" fill="url(#badge-glow)" stroke="#1E3A5F" stroke-width="1" />
          <polygon points="12,7 16,11 12,15 8,11" fill="#38BDF8" />
          <text x="22" y="14.5" font-family="'Segoe UI',sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.2" fill="#93C5FD">LOCAL-FIRST v1.2.2</text>
        </g>
        <!-- Cryptographic Seal Badge -->
        <g transform="translate(306, 0)">
          <rect x="0" y="0" width="176" height="22" rx="11" fill="url(#badge-glow)" stroke="#163A48" stroke-width="1" />
          <circle cx="11" cy="11" r="3.5" fill="#2DD4BF" />
          <text x="21" y="14.5" font-family="'Segoe UI',sans-serif" font-size="9" font-weight="700" letter-spacing="1" fill="#67E8F9">ZERO-SIMULATION VERIFIED</text>
        </g>
      </g>

      <!-- Main Engine Title -->
      <text x="0" y="112" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="34" font-weight="800" letter-spacing="4" fill="url(#text-title-grad)">ZYNTHEOR AI ENGINE</text>

      <!-- Subtitle & Value Proposition -->
      <text x="0" y="140" font-family="'Noto Sans Thai','Segoe UI',sans-serif" font-size="14.5" font-weight="600" fill="#E2E8F0" letter-spacing="0.5">Sovereign AI Engineering Workspace &amp; Autonomous Intelligence Core</text>

      <!-- Architectural Feature Micro-Tags -->
      <g transform="translate(0, 168)">
        <!-- Tag 1 -->
        <g>
          <rect x="0" y="0" width="144" height="24" rx="6" fill="#0A1828" stroke="#16344F" stroke-width="1" />
          <text x="12" y="16" font-family="'Noto Sans Thai','Segoe UI',sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8">🛡️ Air-Gap &amp; Local Mode</text>
        </g>
        <!-- Tag 2 -->
        <g transform="translate(152, 0)">
          <rect x="0" y="0" width="156" height="24" rx="6" fill="#0A1828" stroke="#16344F" stroke-width="1" />
          <text x="12" y="16" font-family="'Noto Sans Thai','Segoe UI',sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8">⛓️ SHA-256 Audit Chain</text>
        </g>
        <!-- Tag 3 -->
        <g transform="translate(316, 0)">
          <rect x="0" y="0" width="168" height="24" rx="6" fill="#0A1828" stroke="#16344F" stroke-width="1" />
          <text x="12" y="16" font-family="'Noto Sans Thai','Segoe UI',sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8">⚡ ZYNTHEOR CORE + External</text>
        </g>
      </g>

      <!-- Integrity Status Line -->
      <g transform="translate(0, 214)">
        <line x1="0" y1="0" x2="600" y2="0" stroke="#132B42" stroke-width="1" />
        <text x="0" y="16" font-family="'Segoe UI',sans-serif" font-size="9.5" fill="#64748B" letter-spacing="1">FAIL-CLOSED GOVERNANCE · STRICT EVIDENCE POLICY · NO SIMULATED METRICS</text>
      </g>
    </g>

    <!-- Animated Border Laser Accent -->
    <rect x="4" y="4" width="832" height="272" rx="18" fill="none" stroke="url(#teal-cyan-glow)" stroke-width="2" stroke-linecap="round" pathLength="200" class="laser-stroke" filter="url(#hdr-neon)" />
  </g>
</svg>

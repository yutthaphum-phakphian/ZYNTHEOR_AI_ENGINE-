<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" width="840" height="280" role="img" aria-label="ZYNTHEOR AI ENGINE - Sovereign Local-First Intelligence &amp; Autonomous Engineering Core">
  <defs>
    <linearGradient id="hd-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060C16"/><stop offset="0.5" stop-color="#0A1424"/><stop offset="1" stop-color="#080F1B"/></linearGradient>
    <linearGradient id="hd-laser" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#10B981"/><stop offset="0.5" stop-color="#2DD4BF"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
    <linearGradient id="hd-title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34D399"/><stop offset="0.45" stop-color="#2DD4BF"/><stop offset="0.85" stop-color="#38BDF8"/><stop offset="1" stop-color="#60A5FA"/></linearGradient>
    <linearGradient id="hd-badge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F2438"/><stop offset="1" stop-color="#0A1624"/></linearGradient>
    <linearGradient id="hd-beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2DD4BF" stop-opacity="0"/><stop offset="0.5" stop-color="#2DD4BF" stop-opacity="0.13"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></linearGradient>
    <linearGradient id="hd-rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#14B8A6" stop-opacity="0"/><stop offset="0.5" stop-color="#2DD4BF" stop-opacity="0.8"/><stop offset="1" stop-color="#14B8A6" stop-opacity="0"/></linearGradient>
    <linearGradient id="bf-horn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14B8A6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <linearGradient id="bf-body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0D9488"/><stop offset="1" stop-color="#0F766E"/></linearGradient>
    <pattern id="hd-grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M 30 0 L 0 0 0 30" fill="none" stroke="#132338" stroke-width="0.8" stroke-opacity="0.45"/><circle cx="0" cy="0" r="1" fill="#14B8A6" fill-opacity="0.3"/></pattern>
    <filter id="hd-glow" filterUnits="userSpaceOnUse" x="-20" y="-20" width="880" height="320"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="hd-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="hd-clip"><rect x="4" y="4" width="832" height="272" rx="18"/></clipPath>
  </defs>
  <style>
    @keyframes lz   { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    @keyframes lzr  { from { stroke-dashoffset: 0; }   to { stroke-dashoffset: 100; } }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    @keyframes beam { from { transform: translateX(-220px); } to { transform: translateX(1060px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes blink { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes pulse { 0%,100% { transform: scale(.94); opacity: .85; } 50% { transform: scale(1.06); opacity: 1; } }
    .lz   { stroke-dasharray: 14 86; animation: lz 6s linear infinite; }
    .lzr  { stroke-dasharray: 9 91;  animation: lzr 8s linear infinite; }
    .flow { stroke-dasharray: 5 7;   animation: flow 1.4s linear infinite; }
    .run  { stroke-dasharray: 9 91;  animation: lz 4.2s linear infinite; }
    .beam { animation: beam 9s linear infinite; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 18s linear infinite; }
    .blink{ animation: blink 2.8s ease-in-out infinite; }
    .pulse{ transform-box: fill-box; transform-origin: center; animation: pulse 3s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .lz,.lzr,.flow,.run,.beam,.spin,.blink,.pulse { animation: none; }
      .beam { opacity: 0; }
    }
  </style>

  <rect x="4" y="4" width="832" height="272" rx="18" fill="url(#hd-bg)" stroke="#162E48" stroke-width="1.5"/>

  <g clip-path="url(#hd-clip)">
    <rect x="4" y="4" width="832" height="272" fill="url(#hd-grid)"/>
    <circle cx="210" cy="50" r="140" fill="#14B8A6" fill-opacity="0.07" filter="url(#hd-glow)"/>
    <circle cx="630" cy="70" r="160" fill="#38BDF8" fill-opacity="0.06" filter="url(#hd-glow)"/>
    <circle cx="420" cy="150" r="180" fill="#10B981" fill-opacity="0.045" filter="url(#hd-glow)"/>

    <!-- circuit traces: flowing dashes + glowing runners -->
    <g fill="none" stroke-linecap="round">
      <path d="M 30 50 L 120 50 L 160 90 L 220 90" stroke="#1B4A6B" stroke-width="1.3" class="flow"/>
      <path d="M 30 50 L 120 50 L 160 90 L 220 90" pathLength="100" stroke="#5EEAD4" stroke-width="2" class="run" filter="url(#hd-soft)"/>
      <path d="M 60 190 L 140 190 L 170 160 L 210 160" stroke="#1B4A6B" stroke-width="1.3" class="flow"/>
      <path d="M 60 190 L 140 190 L 170 160 L 210 160" pathLength="100" stroke="#38BDF8" stroke-width="2" class="run" style="animation-delay:-1.6s" filter="url(#hd-soft)"/>
      <path d="M 810 50 L 720 50 L 680 90 L 620 90" stroke="#1B4A6B" stroke-width="1.3" class="flow"/>
      <path d="M 810 50 L 720 50 L 680 90 L 620 90" pathLength="100" stroke="#38BDF8" stroke-width="2" class="run" style="animation-delay:-2.4s" filter="url(#hd-soft)"/>
      <path d="M 780 190 L 700 190 L 670 160 L 630 160" stroke="#1B4A6B" stroke-width="1.3" class="flow"/>
      <path d="M 780 190 L 700 190 L 670 160 L 630 160" pathLength="100" stroke="#5EEAD4" stroke-width="2" class="run" style="animation-delay:-0.8s" filter="url(#hd-soft)"/>
    </g>
    <circle cx="30" cy="50" r="2.6" fill="#38BDF8"/><circle cx="60" cy="190" r="2.6" fill="#14B8A6"/>
    <circle cx="810" cy="50" r="2.6" fill="#10B981"/><circle cx="780" cy="190" r="2.6" fill="#38BDF8"/>
    <circle cx="220" cy="90" r="3.2" fill="#10B981" class="blink"/><circle cx="210" cy="160" r="3.2" fill="#38BDF8" class="blink" style="animation-delay:-1s"/>
    <circle cx="620" cy="90" r="3.2" fill="#38BDF8" class="blink" style="animation-delay:-2s"/><circle cx="630" cy="160" r="3.2" fill="#14B8A6" class="blink" style="animation-delay:-0.5s"/>

    <!-- sweeping scan beam -->
    <rect class="beam" x="0" y="4" width="200" height="272" fill="url(#hd-beam)"/>

    <!-- bottom running rule -->
    <rect x="40" y="262" width="760" height="1.5" fill="url(#hd-rule)" opacity="0.7"/>
  </g>

  <!-- corner brackets -->
  <g fill="none" stroke="#2DD4BF" stroke-width="1.6" stroke-linecap="round" opacity="0.75">
    <path d="M 16 36 V 16 H 36"/><path d="M 804 16 H 824 V 36"/><path d="M 16 244 V 264 H 36"/><path d="M 824 244 V 264 H 804"/>
  </g>

  <!-- emblem: hexagon + buffalo mark + rotating ring -->
  <g transform="translate(420, 52)">
    <circle r="40" fill="none" stroke="#2DD4BF" stroke-opacity="0.55" stroke-width="1.2" stroke-dasharray="3 9" class="spin"/>
    <polygon points="0,-31 26.8,-15.5 26.8,15.5 0,31 -26.8,15.5 -26.8,-15.5" fill="#0C1B2E" stroke="#14B8A6" stroke-width="1.8" filter="url(#hd-soft)"/>
    <polygon points="0,-24 20.8,-12 20.8,12 0,24 -20.8,12 -20.8,-12" fill="#081422" stroke="#38BDF8" stroke-opacity="0.7" stroke-width="1"/>
    <g class="pulse"><g transform="scale(0.62) translate(-32,-30)">
      <path d="M18 22 L8 8 L14 10 L22 20 Z" fill="url(#bf-horn)"/>
      <path d="M46 22 L56 8 L50 10 L42 20 Z" fill="url(#bf-horn)"/>
      <path d="M20 24 L32 18 L44 24 L46 38 L32 48 L18 38 Z" fill="url(#bf-body)" stroke="#134E4A" stroke-width="1.2"/>
      <path d="M24 28 L32 24 L40 28 L41 36 L32 42 L23 36 Z" fill="#0A1624" opacity="0.55"/>
      <circle cx="27" cy="32" r="1.8" fill="#5EEAD4"/>
      <circle cx="37" cy="32" r="1.8" fill="#5EEAD4"/>
    </g></g>
  </g>

  <text x="420" y="140" text-anchor="middle" font-family="'Noto Sans Thai','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif" font-size="52" font-weight="900" letter-spacing="8" fill="url(#hd-title)" filter="url(#hd-soft)">ZYNTHEOR</text>
  <text x="420" y="170" text-anchor="middle" font-family="'Noto Sans Thai','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif" font-size="16" font-weight="700" letter-spacing="14" fill="#E2E8F0">AI ENGINE</text>
  <text x="420" y="194" text-anchor="middle" font-family="'Noto Sans Thai','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif" font-size="12" font-weight="500" letter-spacing="2.5" fill="#2DD4BF">SOVEREIGN LOCAL-FIRST INTELLIGENCE &amp; AUTONOMOUS ENGINEERING CORE</text>

  <g transform="translate(54, 216)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="160" height="30" rx="8" fill="url(#hd-badge)" stroke="#1E3A58" stroke-width="1.2"/>
      <circle cx="16" cy="15" r="4" fill="#10B981" class="blink" style="animation-delay:0s"/>
      <text x="28" y="19" font-family="'Segoe UI','Noto Sans Thai',sans-serif" font-size="9.5" font-weight="700" letter-spacing="1" fill="#94A3B8">LOCAL-ONLY MODE</text>
    </g>
    <g transform="translate(174, 0)">
      <rect x="0" y="0" width="170" height="30" rx="8" fill="url(#hd-badge)" stroke="#1E3A58" stroke-width="1.2"/>
      <circle cx="16" cy="15" r="4" fill="#38BDF8" class="blink" style="animation-delay:-0.7s"/>
      <text x="28" y="19" font-family="'Segoe UI','Noto Sans Thai',sans-serif" font-size="9.5" font-weight="700" letter-spacing="1" fill="#94A3B8">SHA-256 HASH CHAIN</text>
    </g>
    <g transform="translate(358, 0)">
      <rect x="0" y="0" width="184" height="30" rx="8" fill="url(#hd-badge)" stroke="#1E3A58" stroke-width="1.2"/>
      <circle cx="16" cy="15" r="4" fill="#14B8A6" class="blink" style="animation-delay:-1.4s"/>
      <text x="28" y="19" font-family="'Segoe UI','Noto Sans Thai',sans-serif" font-size="9.5" font-weight="700" letter-spacing="1" fill="#94A3B8">RECHARTS &amp; D3 AST MAP</text>
    </g>
    <g transform="translate(556, 0)">
      <rect x="0" y="0" width="176" height="30" rx="8" fill="url(#hd-badge)" stroke="#1E3A58" stroke-width="1.2"/>
      <circle cx="16" cy="15" r="4" fill="#34D399" class="blink" style="animation-delay:-2.1s"/>
      <text x="28" y="19" font-family="'Segoe UI','Noto Sans Thai',sans-serif" font-size="9.5" font-weight="700" letter-spacing="1" fill="#94A3B8">OLLAMA / GEMINI CORE</text>
    </g>
  </g>

  <!-- border lasers -->
  <rect x="4" y="4" width="832" height="272" rx="18" fill="none" stroke="url(#hd-laser)" stroke-width="2.6" stroke-linecap="round" pathLength="100" class="lz" filter="url(#hd-glow)"/>
  <rect x="4" y="4" width="832" height="272" rx="18" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" pathLength="100" class="lzr" filter="url(#hd-glow)"/>
</svg>

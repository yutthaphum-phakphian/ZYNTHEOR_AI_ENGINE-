<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" width="840" height="280" role="img" aria-label="ZYNTHEOR AI ENGINE - Sovereign Local-First Intelligence &amp; Autonomous Engineering Core">
  <defs>
    <linearGradient id="hd-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050A14"/><stop offset="0.55" stop-color="#0A1628"/><stop offset="1" stop-color="#07111F"/></linearGradient>
    <linearGradient id="hd-laser" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#10B981"/><stop offset="0.5" stop-color="#2DD4BF"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
    <linearGradient id="hd-title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34D399"/><stop offset="0.45" stop-color="#2DD4BF"/><stop offset="0.85" stop-color="#38BDF8"/><stop offset="1" stop-color="#60A5FA"/></linearGradient>
    <linearGradient id="hd-badge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10283E"/><stop offset="1" stop-color="#0A1827"/></linearGradient>
    <linearGradient id="hd-beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2DD4BF" stop-opacity="0"/><stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.16"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></linearGradient>
    <linearGradient id="hd-rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2DD4BF" stop-opacity="0.9"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></linearGradient>
    <linearGradient id="bf-horn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14B8A6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <linearGradient id="bf-body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0D9488"/><stop offset="1" stop-color="#0F766E"/></linearGradient>
    <radialGradient id="hd-halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2DD4BF" stop-opacity="0.35"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient>
    <pattern id="hd-grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M 30 0 L 0 0 0 30" fill="none" stroke="#132338" stroke-width="0.8" stroke-opacity="0.5"/><circle cx="0" cy="0" r="1" fill="#14B8A6" fill-opacity="0.35"/></pattern>
    <filter id="hd-glow" filterUnits="userSpaceOnUse" x="-20" y="-20" width="880" height="320"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="hd-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="hd-clip"><rect x="4" y="4" width="832" height="272" rx="18"/></clipPath>
  </defs>
  <style>
    @keyframes lz   { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    @keyframes lzr  { from { stroke-dashoffset: 0; }   to { stroke-dashoffset: 100; } }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    @keyframes beam { from { transform: translateX(-220px); } to { transform: translateX(1060px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes spinr { to { transform: rotate(-360deg); } }
    @keyframes blink { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes pulse { 0%,100% { transform: scale(.95); opacity: .88; } 50% { transform: scale(1.06); opacity: 1; } }
    .lz   { stroke-dasharray: 28 72; animation: lz 6s linear infinite; }
    .lzr  { stroke-dasharray: 18 82; animation: lzr 8s linear infinite; }
    .flow { stroke-dasharray: 5 7;   animation: flow 1.4s linear infinite; }
    .run  { stroke-dasharray: 9 91;  animation: lz 4.2s linear infinite; }
    .beam { animation: beam 9s linear infinite; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 18s linear infinite; }
    .spinr { transform-box: fill-box; transform-origin: center; animation: spinr 12s linear infinite; }
    .blink{ animation: blink 2.8s ease-in-out infinite; }
    .pulse{ transform-box: fill-box; transform-origin: center; animation: pulse 3s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .lz,.lzr,.flow,.run,.beam,.spin,.spinr,.blink,.pulse { animation: none; }
      .beam { opacity: 0; }
    }
  </style>

  <rect x="4" y="4" width="832" height="272" rx="18" fill="url(#hd-bg)" stroke="#173553" stroke-width="1.5"/>

  <g clip-path="url(#hd-clip)">
    <rect x="4" y="4" width="832" height="272" fill="url(#hd-grid)"/>
    <circle cx="125" cy="118" r="150" fill="url(#hd-halo)"/>
    <circle cx="700" cy="60" r="170" fill="#38BDF8" fill-opacity="0.06" filter="url(#hd-glow)"/>

    <!-- circuit traces -->
    <g fill="none" stroke-linecap="round">
      <path d="M 24 238 L 24 205 L 52 190" stroke="#1B4A6B" stroke-width="1.3" class="flow"/>
      <path d="M 24 238 L 24 205 L 52 190" pathLength="100" stroke="#5EEAD4" stroke-width="2" class="run" filter="url(#hd-soft)"/>
      <path d="M 816 40 L 816 74 L 790 92" stroke="#1B4A6B" stroke-width="1.3" class="flow"/>
      <path d="M 816 40 L 816 74 L 790 92" pathLength="100" stroke="#38BDF8" stroke-width="2" class="run" style="animation-delay:-2.2s" filter="url(#hd-soft)"/>
      <path d="M 232 56 L 232 30 L 300 30" stroke="#1B4A6B" stroke-width="1.3" class="flow"/>
      <path d="M 232 56 L 232 30 L 300 30" pathLength="100" stroke="#38BDF8" stroke-width="2" class="run" style="animation-delay:-1.4s" filter="url(#hd-soft)"/>
    </g>
    <circle cx="52" cy="190" r="3" fill="#10B981" class="blink"/><circle cx="790" cy="92" r="3" fill="#38BDF8" class="blink" style="animation-delay:-1.2s"/><circle cx="300" cy="30" r="3" fill="#14B8A6" class="blink" style="animation-delay:-2s"/>

    <rect class="beam" x="0" y="4" width="200" height="272" fill="url(#hd-beam)"/>
  </g>

  <!-- corner brackets -->
  <g fill="none" stroke="#2DD4BF" stroke-width="1.8" stroke-linecap="round" opacity="0.8">
    <path d="M 16 36 V 16 H 36"/><path d="M 804 16 H 824 V 36"/><path d="M 16 244 V 264 H 36"/><path d="M 824 244 V 264 H 804"/>
  </g>

  <!-- emblem (left): rings + hexagon + buffalo mark -->
  <g transform="translate(125, 112)">
    <circle r="68" fill="none" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="2 10" class="spinr"/>
    <circle r="58" fill="none" stroke="#2DD4BF" stroke-opacity="0.6" stroke-width="1.4" stroke-dasharray="22 14" class="spin"/>
    <polygon points="0,-46 39.8,-23 39.8,23 0,46 -39.8,23 -39.8,-23" fill="#0C1B2E" stroke="#14B8A6" stroke-width="2.2" filter="url(#hd-soft)"/>
    <polygon points="0,-36 31.2,-18 31.2,18 0,36 -31.2,18 -31.2,-18" fill="#081422" stroke="#38BDF8" stroke-opacity="0.75" stroke-width="1.2"/>
    <g class="pulse"><g transform="scale(0.95) translate(-32,-30)">
      <path d="M18 22 L8 8 L14 10 L22 20 Z" fill="url(#bf-horn)"/>
      <path d="M46 22 L56 8 L50 10 L42 20 Z" fill="url(#bf-horn)"/>
      <path d="M20 24 L32 18 L44 24 L46 38 L32 48 L18 38 Z" fill="url(#bf-body)" stroke="#134E4A" stroke-width="1.2"/>
      <path d="M24 28 L32 24 L40 28 L41 36 L32 42 L23 36 Z" fill="#0A1624" opacity="0.55"/>
      <circle cx="27" cy="32" r="1.8" fill="#5EEAD4"/>
      <circle cx="37" cy="32" r="1.8" fill="#5EEAD4"/>
    </g></g>
  </g>

  <!-- title block (left aligned) -->
  <text id="t1" x="236" y="104" font-family="'Noto Sans Thai','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif" font-size="62" font-weight="900" letter-spacing="6" fill="url(#hd-title)" filter="url(#hd-soft)">ZYNTHEOR</text>
  <text id="t2" x="240" y="136" font-family="'Noto Sans Thai','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif" font-size="19" font-weight="700" letter-spacing="13" fill="#E2E8F0">AI ENGINE</text>
  <rect x="240" y="148" width="400" height="2" rx="1" fill="url(#hd-rule)"/>
  <text id="t3" x="240" y="170" font-family="'Noto Sans Thai','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif" font-size="12.5" font-weight="600" letter-spacing="2.4" fill="#2DD4BF">SOVEREIGN LOCAL-FIRST INTELLIGENCE</text>
  <text id="t4" x="240" y="190" font-family="'Noto Sans Thai','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif" font-size="12.5" font-weight="600" letter-spacing="2.4" fill="#2DD4BF">&amp; AUTONOMOUS ENGINEERING CORE</text>

  <!-- right HUD: edition chip + radar rings (decorative only) -->
  <g transform="translate(660, 28)">
    <rect width="150" height="24" rx="12" fill="#0B2236" stroke="#2DD4BF" stroke-opacity="0.6" stroke-width="1.1"/>
    <circle cx="14" cy="12" r="3.2" fill="#10B981" class="blink"/>
    <text id="t5" x="24" y="16" font-family="'Noto Sans Thai','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.6" fill="#5EEAD4">BUFFALO EDITION</text>
  </g>
  <g transform="translate(748, 124)">
    <circle r="40" fill="none" stroke="#1E4468" stroke-width="1"/>
    <circle r="40" fill="none" stroke="#38BDF8" stroke-width="1.6" stroke-dasharray="30 222" class="spin"/>
    <circle r="27" fill="none" stroke="#2DD4BF" stroke-opacity="0.6" stroke-width="1.2" stroke-dasharray="3 7" class="spinr"/>
    <circle r="13" fill="none" stroke="#14B8A6" stroke-opacity="0.8" stroke-width="1.2"/>
    <circle r="3.5" fill="#38BDF8" class="blink"/>
  </g>

  <!-- badges -->
  <g transform="translate(0, 216)">
    <g transform="translate(43.0, 0)">
      <rect width="155" height="30" rx="8" fill="url(#hd-badge)" stroke="#1E4468" stroke-width="1.2"/>
      <circle cx="16" cy="15" r="4" fill="#10B981" class="blink" style="animation-delay:-0.0s"/>
      <text id="bt0" x="28" y="19.5" font-family="'Segoe UI','Noto Sans Thai',Roboto,sans-serif" font-size="10" font-weight="700" letter-spacing="0.5" fill="#A7B6CC">LOCAL-ONLY MODE</text>
    </g>
    <g transform="translate(208.0, 0)">
      <rect width="166" height="30" rx="8" fill="url(#hd-badge)" stroke="#1E4468" stroke-width="1.2"/>
      <circle cx="16" cy="15" r="4" fill="#38BDF8" class="blink" style="animation-delay:-0.7s"/>
      <text id="bt1" x="28" y="19.5" font-family="'Segoe UI','Noto Sans Thai',Roboto,sans-serif" font-size="10" font-weight="700" letter-spacing="0.5" fill="#A7B6CC">SHA-256 HASH CHAIN</text>
    </g>
    <g transform="translate(384.0, 0)">
      <rect width="189" height="30" rx="8" fill="url(#hd-badge)" stroke="#1E4468" stroke-width="1.2"/>
      <circle cx="16" cy="15" r="4" fill="#14B8A6" class="blink" style="animation-delay:-1.4s"/>
      <text id="bt2" x="28" y="19.5" font-family="'Segoe UI','Noto Sans Thai',Roboto,sans-serif" font-size="10" font-weight="700" letter-spacing="0.5" fill="#A7B6CC">RECHARTS &amp; D3 AST MAP</text>
    </g>
    <g transform="translate(583.0, 0)">
      <rect width="214" height="30" rx="8" fill="url(#hd-badge)" stroke="#1E4468" stroke-width="1.2"/>
      <circle cx="16" cy="15" r="4" fill="#34D399" class="blink" style="animation-delay:-2.1s"/>
      <text id="bt3" x="28" y="19.5" font-family="'Segoe UI','Noto Sans Thai',Roboto,sans-serif" font-size="10" font-weight="700" letter-spacing="0.5" fill="#A7B6CC">ZYNTHEOR CORE + EXTERNAL</text>
    </g>
  </g>

  <!-- border: static neon rim + running lasers -->
  <rect x="4" y="4" width="832" height="272" rx="18" fill="none" stroke="url(#hd-laser)" stroke-width="1.6" stroke-opacity="0.5" filter="url(#hd-glow)"/>
  <rect x="4" y="4" width="832" height="272" rx="18" fill="none" stroke="url(#hd-laser)" stroke-width="3.6" stroke-linecap="round" pathLength="100" class="lz" filter="url(#hd-glow)"/>
  <rect x="4" y="4" width="832" height="272" rx="18" fill="none" stroke="#7DD3FC" stroke-width="2.8" stroke-linecap="round" pathLength="100" class="lzr" filter="url(#hd-glow)"/>
</svg>

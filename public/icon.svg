<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08101D"/>
      <stop offset="100%" stop-color="#040913"/>
    </linearGradient>
    <linearGradient id="horn-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="horn-r" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="crest" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="icon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- App Rounded Icon Base -->
  <rect width="192" height="192" rx="42" fill="url(#bg)" stroke="#163C5C" stroke-width="3"/>
  <rect x="8" y="8" width="176" height="176" rx="36" fill="none" stroke="#102942" stroke-width="1.5"/>

  <!-- Centered Scaled Buffalo Mark -->
  <g transform="translate(96, 96) scale(1.6) translate(-36, -36)">
    <!-- Hexagonal Glow Ring -->
    <polygon points="36,4 64,20 64,52 36,68 8,52 8,20" fill="#0A182A" stroke="#1A4A72" stroke-width="1.6"/>

    <!-- Left Cyber Horn -->
    <path d="M 22 25 L 10 10 L 16 12 L 27 23 Z" fill="url(#horn-l)" filter="url(#icon-glow)"/>
    <path d="M 12 11 L 18 16 L 24 23 Z" fill="#2DD4BF" opacity="0.8"/>

    <!-- Right Cyber Horn -->
    <path d="M 50 25 L 62 10 L 56 12 L 45 23 Z" fill="url(#horn-r)" filter="url(#icon-glow)"/>
    <path d="M 60 11 L 54 16 L 48 23 Z" fill="#2DD4BF" opacity="0.8"/>

    <!-- Head Chassis -->
    <polygon points="36,18 52,27 49,46 36,58 23,46 20,27" fill="#071526" stroke="#1D607E" stroke-width="1.5"/>

    <!-- Crown Brow Crest -->
    <polygon points="36,20 46,26 42,30 36,26 30,30 26,26" fill="url(#crest)" opacity="0.95"/>

    <!-- Inner Visor Plate -->
    <polygon points="36,30 44,34 43,43 36,49 29,43 28,34" fill="#030912" stroke="#2DD4BF" stroke-width="1"/>

    <!-- Sensor Eyes -->
    <circle cx="31" cy="37" r="2.4" fill="#38BDF8" filter="url(#icon-glow)"/>
    <circle cx="41" cy="37" r="2.4" fill="#38BDF8" filter="url(#icon-glow)"/>
    <circle cx="31" cy="37" r="1" fill="#FFFFFF"/>
    <circle cx="41" cy="37" r="1" fill="#FFFFFF"/>

    <!-- Core Forensic Node -->
    <polygon points="36,44 38,47 36,50 34,47" fill="#10B981" filter="url(#icon-glow)"/>
    <circle cx="36" cy="47" r="0.9" fill="#FFFFFF"/>
  </g>
</svg>

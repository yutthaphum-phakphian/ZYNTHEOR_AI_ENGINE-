<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="40%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <linearGradient id="cyan-orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>

    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#0F766E" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#080F1B" stop-opacity="0" />
    </radialGradient>

    <filter id="icon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes spin-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spin-ccw {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes breathe {
        0%, 100% { transform: scale(0.96); opacity: 0.88; }
        50% { transform: scale(1.05); opacity: 1; }
      }
      @keyframes pulse-ring {
        0%, 100% { stroke-opacity: 0.35; }
        50% { stroke-opacity: 0.85; }
      }
      .spin-orbit-cw {
        transform-origin: 64px 64px;
        animation: spin-cw 12s linear infinite;
      }
      .spin-orbit-ccw {
        transform-origin: 64px 64px;
        animation: spin-ccw 16s linear infinite;
      }
      .star-pulsing {
        transform-origin: 64px 64px;
        animation: breathe 3.2s ease-in-out infinite;
      }
      .ring-pulsing {
        animation: pulse-ring 3.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Base App Tile -->
  <rect width="128" height="128" rx="28" fill="#0D1828" stroke="#172A40" stroke-width="2" />

  <!-- Ambient Glow -->
  <circle cx="64" cy="64" r="46" fill="url(#center-glow)" opacity="0.6" class="star-pulsing" />

  <!-- Outer Orbit (Counter-Clockwise) -->
  <g class="spin-orbit-ccw">
    <circle cx="64" cy="64" r="48" fill="none" stroke="#172A40" stroke-width="1.2" stroke-dasharray="16 12 6 12" class="ring-pulsing" />
    <circle cx="64" cy="16" r="2.8" fill="#38BDF8" filter="url(#icon-glow)" />
    <circle cx="64" cy="112" r="2.4" fill="#10B981" />
  </g>

  <!-- Tilted Orbit (Clockwise) -->
  <g class="spin-orbit-cw">
    <ellipse cx="64" cy="64" rx="44" ry="24" fill="none" stroke="url(#cyan-orbit)" stroke-width="1.4" stroke-dasharray="30 15" opacity="0.8" />
    <circle cx="108" cy="64" r="3.2" fill="#F1F5F9" filter="url(#icon-glow)" />
    <circle cx="20" cy="64" r="2.4" fill="#14B8A6" />
  </g>

  <!-- Zyntheor Signature Crystal Star -->
  <g class="star-pulsing">
    <path d="M64 16 L74 46 L105 53 L81 72 L84 104 L64 86 L44 104 L47 72 L23 53 L54 46 Z" fill="url(#g)" filter="url(#icon-glow)" />

    <!-- Center Radiant Core -->
    <circle cx="64" cy="64" r="9.5" fill="#ffffff" filter="url(#icon-glow)" />
    <circle cx="64" cy="64" r="5" fill="#0D9488" />
    <circle cx="64" cy="64" r="2" fill="#ffffff" />
  </g>
</svg>

name: Native CORE 1.2.6 - Dataset & Eval
on:
  push:
    paths:
      - 'training/**'
      - 'src/components/NativeModelStatusPanel.tsx'
      - '.github/workflows/native-core-1.1.0.yml'
  workflow_dispatch:

jobs:
  native-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Check Env
        run: npm run check:env 2>&1 | tee native-core-audit.txt

      - name: Verify Dataset Manifest
        run: |
          echo "## Dataset Manifest" | tee -a native-core-audit.txt
          ls -lh training/dataset/manifest.json training/dataset/samples.json | tee -a native-core-audit.txt
          node training/scripts/verify_dataset.mjs 2>&1 | tee -a native-core-audit.txt || echo "UNVERIFIED: verify_dataset failed - check manifest" | tee -a native-core-audit.txt

      - name: Quality Gates
        run: |
          echo "## Quality Gates" | tee -a native-core-audit.txt
          node training/scripts/quality_gates.mjs 2>&1 | tee -a native-core-audit.txt || echo "Quality gates check" | tee -a native-core-audit.txt

      - name: Baseline Evaluation
        run: |
          echo "## Baseline Eval" | tee -a native-core-audit.txt
          node training/scripts/evaluate_baseline.mjs 2>&1 | tee -a native-core-audit.txt || echo "UNVERIFIED: No checkpoint - SPECIFICATION_LOCKED_PENDING_GPU_RUN" | tee -a native-core-audit.txt

      - name: Full Verify (real)
        run: npm run verify 2>&1 | tee -a native-core-audit.txt

      - uses: actions/upload-artifact@v4
        with:
          name: NATIVE_CORE_1.2.6_AUDIT
          path: native-core-audit.txt

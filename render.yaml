services:
  - type: web
    name: zyntheor-ai-engine
    env: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npx tsx server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: HOST
        value: 0.0.0.0
      - key: ZYNTHEOR_LOCAL_ONLY
        value: "true"
      - key: ZYNTHEOR_ACCESS_TOKEN
        generateValue: true
      - key: TENANT_STORAGE_HMAC_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: ZYNTHEOR_MODEL_API_KEY
        sync: false
    healthCheckPath: /api/health

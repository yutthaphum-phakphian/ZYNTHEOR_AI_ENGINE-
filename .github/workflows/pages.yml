name: Deploy ZYNTHEOR Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build (ถ้ามี)
        run: |
          if npm run | grep -q "build"; then npm run build; fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # ถ้าบง build แล้วได้โฟลเดอร์ dist ให้เปลี่ยนตรงนี้เป็น dist
          # ถ้าใช้ไฟล์ thai-workspace.html ตรงๆ ให้ใช้ .
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

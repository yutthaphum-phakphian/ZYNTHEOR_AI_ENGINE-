name: ZYNTHEOR CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Type true to confirm production deployment from the main branch"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: zyntheor-cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Build frontend and backend
        run: npm run build
        env:
          GEMINI_API_KEY: "dummy_key_for_build"

      - name: Health check agent
        run: npm run test:agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  docker-build-push:
    needs: build-and-test
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.confirm_production_deploy == true))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image-name
        env:
          RAW_IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: echo "name=${RAW_IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image-name.outputs.name }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-cloud:
    needs: docker-build-push
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.confirm_production_deploy == true))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Trigger deployment (Railway)
        env:
          RAILWAY_WEBHOOK: ${{ secrets.RAILWAY_DEPLOY_WEBHOOK }}
        run: |
          if [ -n "$RAILWAY_WEBHOOK" ]; then
            curl --fail --silent --show-error -X POST "$RAILWAY_WEBHOOK"
          else
            echo "RAILWAY_DEPLOY_WEBHOOK secret is not set, skipping remote trigger."
          fi

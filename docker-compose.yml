version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: zyntheor_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zyntheor_admin
      POSTGRES_PASSWORD: secure_password_here
      POSTGRES_DB: zyntheor_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zyntheor_admin -d zyntheor_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="ZYNTHEOR CORE mark">
  <defs>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="50%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0D1828" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="#0D1828"/>
  <circle cx="64" cy="64" r="46" fill="none" stroke="url(#ring)" stroke-width="3" opacity="0.9" filter="url(#soft)"/>
  <circle cx="64" cy="64" r="28" fill="url(#core)"/>
  <circle cx="64" cy="64" r="10" fill="#f8fafc"/>
  <circle cx="64" cy="64" r="4" fill="#0D9488"/>
  <!-- orbit dots -->
  <circle cx="64" cy="18" r="3" fill="#38BDF8"/>
  <circle cx="110" cy="64" r="3" fill="#14B8A6"/>
  <circle cx="64" cy="110" r="3" fill="#10B981"/>
  <circle cx="18" cy="64" r="3" fill="#F59E0B"/>
</svg>

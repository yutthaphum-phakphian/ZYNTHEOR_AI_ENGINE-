<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" width="840" height="260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080F1B"/><stop offset="1" stop-color="#0D1828"/>
    </linearGradient>
    <linearGradient id="run" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10B981"/><stop offset=".5" stop-color="#38BDF8"/><stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10B981"/><stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="wv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10B981" stop-opacity=".35"/><stop offset="1" stop-color="#38BDF8" stop-opacity=".35"/>
    </linearGradient>
    <clipPath id="c"><rect x="4" y="4" width="832" height="252" rx="20"/></clipPath>
    <filter id="g" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="832" height="252" rx="20" fill="url(#bg)" stroke="#16324a" stroke-width="1.5"/>

  <g clip-path="url(#c)">
    <path fill="url(#wv)" d="M0 215 Q105 190 210 215 T420 215 T630 215 T840 215 T1050 215 T1260 215 T1470 215 T1680 215 V260 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-420 0" dur="8s" repeatCount="indefinite"/>
    </path>
    <path fill="url(#wv)" opacity=".7" d="M0 228 Q105 248 210 228 T420 228 T630 228 T840 228 T1050 228 T1260 228 T1470 228 T1680 228 V260 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="-420 0" to="0 0" dur="11s" repeatCount="indefinite"/>
    </path>
  </g>

  <g fill="#38BDF8" opacity=".55">
    <circle cx="90" cy="60" r="2"><animate attributeName="cy" values="60;48;60" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="90" r="2.5"><animate attributeName="cy" values="90;78;90" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="50" r="1.8"><animate attributeName="opacity" values=".2;1;.2" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="150" r="1.8"><animate attributeName="opacity" values="1;.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>

  <text x="420" y="105" text-anchor="middle" font-family="'Noto Sans Thai','Segoe UI',Arial,sans-serif" font-size="58" font-weight="800" letter-spacing="7" fill="url(#ttl)">ZYNTHEOR</text>
  <text x="420" y="145" text-anchor="middle" font-family="'Noto Sans Thai','Segoe UI',Arial,sans-serif" font-size="22" font-weight="600" letter-spacing="12" fill="#E2E8F0">AI ENGINE</text>

  <g font-family="'Noto Sans Thai','Segoe UI',Arial,sans-serif" font-size="15" letter-spacing="2" fill="#2DD4BF" text-anchor="middle">
    <text x="420" y="185" opacity="0">Local-First AI Engineering Workspace
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.05;.22;.27;1" dur="12s" begin="0s" repeatCount="indefinite"/></text>
    <text x="420" y="185" opacity="0">Cryptographic Governance · SHA-256 Hash Chain
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.05;.22;.27;1" dur="12s" begin="3s" repeatCount="indefinite"/></text>
    <text x="420" y="185" opacity="0">Ollama ⇄ Gemini · Human-in-the-loop
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.05;.22;.27;1" dur="12s" begin="6s" repeatCount="indefinite"/></text>
    <text x="420" y="185" opacity="0">Sovereign AI Workspace · Buffalo Edition
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.05;.22;.27;1" dur="12s" begin="9s" repeatCount="indefinite"/></text>
  </g>

  <rect x="4" y="4" width="832" height="252" rx="20" fill="none" stroke="url(#run)" stroke-width="3.5" stroke-linecap="round" pathLength="100" stroke-dasharray="14 86" filter="url(#g)">
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="4" y="4" width="832" height="252" rx="20" fill="none" stroke="#2DD4BF" stroke-width="3.5" stroke-linecap="round" pathLength="100" stroke-dasharray="8 92" filter="url(#g)">
    <animate attributeName="stroke-dashoffset" from="50" to="-50" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>

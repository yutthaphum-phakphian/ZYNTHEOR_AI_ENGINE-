services:
  - type: web
    name: zyntheor-buffalo-110
    env: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npx tsx server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 3000
      - key: ZYNTHEOR_LOCAL_ONLY
        value: true
      - key: ZYNTHEOR_ACCESS_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
    healthCheckPath: /api/health

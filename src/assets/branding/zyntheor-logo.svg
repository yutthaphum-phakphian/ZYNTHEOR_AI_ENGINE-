<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080F1B" />
      <stop offset="50%" stop-color="#0D1828" />
      <stop offset="100%" stop-color="#080F1B" />
    </linearGradient>

    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="35%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>

    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#0D9488" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0F766E" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="aura" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#0D1828" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#080F1B" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="super-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes spin-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spin-ccw {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes breathe {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      @keyframes pulse-ring {
        0%, 100% { opacity: 0.35; stroke-width: 1.2px; }
        50% { opacity: 0.85; stroke-width: 2px; }
      }
      @keyframes shimmer-sweep {
        0% { transform: translateX(-150px); opacity: 0; }
        50% { opacity: 0.5; }
        100% { transform: translateX(750px); opacity: 0; }
      }
      @keyframes text-pulse {
        0%, 100% { filter: drop-shadow(0 0 10px rgba(20,184,166,0.45)); }
        50% { filter: drop-shadow(0 0 22px rgba(20,184,166,0.85)); }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 0.9; transform: scale(1.3); }
      }

      .spin-slow {
        transform-origin: 130px 130px;
        animation: spin-cw 22s linear infinite;
      }
      .spin-medium-reverse {
        transform-origin: 130px 130px;
        animation: spin-ccw 16s linear infinite;
      }
      .spin-fast {
        transform-origin: 130px 130px;
        animation: spin-cw 10s linear infinite;
      }
      .core-pulsing {
        transform-origin: 130px 130px;
        animation: breathe 3.6s ease-in-out infinite;
      }
      .pulse-ring-anim {
        animation: pulse-ring 4s ease-in-out infinite;
      }
      .shimmer {
        animation: shimmer-sweep 7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .brand-title {
        animation: text-pulse 4.5s ease-in-out infinite;
      }
      .star-1 { transform-origin: 290px 45px; animation: twinkle 3s ease-in-out infinite; }
      .star-2 { transform-origin: 790px 60px; animation: twinkle 4s ease-in-out infinite 1.2s; }
      .star-3 { transform-origin: 670px 200px; animation: twinkle 3.5s ease-in-out infinite 2s; }
      .star-4 { transform-origin: 340px 215px; animation: twinkle 2.7s ease-in-out infinite 0.7s; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="876" height="256" rx="20" fill="url(#bg-grad)" stroke="#172A40" stroke-width="1.5" />
  
  <!-- Subtle Grid Pattern in Background -->
  <g opacity="0.08" stroke="#14B8A6" stroke-width="0.8">
    <line x1="2" y1="65" x2="878" y2="65" stroke-dasharray="4 8" />
    <line x1="2" y1="130" x2="878" y2="130" stroke-dasharray="4 8" />
    <line x1="2" y1="195" x2="878" y2="195" stroke-dasharray="4 8" />
    <line x1="260" y1="2" x2="260" y2="258" stroke-dasharray="4 8" />
    <line x1="480" y1="2" x2="480" y2="258" stroke-dasharray="4 8" />
    <line x1="700" y1="2" x2="700" y2="258" stroke-dasharray="4 8" />
  </g>

  <!-- Radial Background Aura -->
  <rect x="2" y="2" width="876" height="256" rx="20" fill="url(#aura)" />

  <!-- Twinkling Micro Stars / Energy Nodes -->
  <circle cx="290" cy="45" r="2" fill="#2DD4BF" class="star-1" />
  <circle cx="790" cy="60" r="1.8" fill="#38BDF8" class="star-2" />
  <circle cx="670" cy="200" r="2.2" fill="#14B8A6" class="star-3" />
  <circle cx="340" cy="215" r="1.5" fill="#10B981" class="star-4" />

  <!-- Shimmer Light Bar running across banner -->
  <g opacity="0.15" class="shimmer">
    <polygon points="120,2 170,2 110,258 60,258" fill="url(#brand-grad)" />
  </g>

  <!-- ANIMATED EMBLEM / LOGO ICON -->
  <g transform="translate(0, 0)">
    <!-- Outer Ambient Glow Area -->
    <circle cx="130" cy="130" r="76" fill="url(#core-glow)" opacity="0.5" class="core-pulsing" />

    <!-- Static Decorative Outer Ring -->
    <circle cx="130" cy="130" r="88" fill="none" stroke="#172A40" stroke-width="1.2" />
    <circle cx="130" cy="130" r="94" fill="none" stroke="#111F32" stroke-width="0.8" stroke-dasharray="3 6" />

    <!-- Counter-Clockwise Rotating Ring with Markers -->
    <g class="spin-medium-reverse">
      <circle cx="130" cy="130" r="78" fill="none" stroke="#0D9488" stroke-width="1.4" stroke-dasharray="24 16 8 16" opacity="0.65" />
      <circle cx="130" cy="52" r="3.2" fill="#38BDF8" filter="url(#glow)" />
      <circle cx="130" cy="208" r="2.5" fill="#14B8A6" />
      <circle cx="52" cy="130" r="2" fill="#2DD4BF" />
      <circle cx="208" cy="130" r="3" fill="#10B981" filter="url(#glow)" />
    </g>

    <!-- Clockwise Rotating Diamond Matrix -->
    <g class="spin-slow">
      <ellipse cx="130" cy="130" rx="72" ry="46" fill="none" stroke="url(#cyan-grad)" stroke-width="1.5" stroke-dasharray="70 20 40 20" opacity="0.75" />
      <circle cx="202" cy="130" r="3.8" fill="#38BDF8" filter="url(#super-glow)" />
      <circle cx="58" cy="130" r="3.2" fill="#2DD4BF" />
    </g>

    <!-- Inner Ring -->
    <g class="spin-fast">
      <ellipse cx="130" cy="130" rx="60" ry="32" fill="none" stroke="#14B8A6" stroke-width="1.2" stroke-dasharray="14 10" opacity="0.8" />
      <circle cx="190" cy="130" r="3" fill="#ffffff" filter="url(#super-glow)" />
    </g>

    <!-- Central Tech Shield -->
    <polygon points="130,76 172,100 172,160 130,184 88,160 88,100" fill="#111F32" stroke="#0D9488" stroke-width="1.8" />
    <polygon points="130,82 166,103 166,157 130,178 94,157 94,103" fill="#172A40" stroke="#14B8A6" stroke-width="1" opacity="0.7" class="pulse-ring-anim" />

    <!-- The Sovereign Crystal / 12-Point Star Core -->
    <g class="core-pulsing">
      <path d="M130 92 L138 116 L163 122 L143 137 L145 163 L130 148 L115 163 L117 137 L97 122 L122 116 Z" fill="url(#brand-grad)" filter="url(#glow)" />
      
      <circle cx="130" cy="130" r="12" fill="#ffffff" filter="url(#super-glow)" />
      <circle cx="130" cy="130" r="6" fill="#14B8A6" />
      <circle cx="130" cy="130" r="2.5" fill="#ffffff" />
    </g>
  </g>

  <!-- TYPOGRAPHY & BRANDING -->
  <g transform="translate(255, 0)">
    <!-- Category Eyebrow Pill -->
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="186" height="24" rx="12" fill="#111F32" stroke="#172A40" stroke-width="1" />
      <circle cx="12" cy="12" r="3.5" fill="#10B981" filter="url(#glow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="24" y="15.5" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#2DD4BF" letter-spacing="1.5">INTELLIGENCE WORKSPACE</text>
    </g>

    <!-- Version Badge -->
    <g transform="translate(196, 48)">
      <rect x="0" y="0" width="132" height="24" rx="12" fill="#111F32" stroke="#172A40" stroke-width="1" />
      <circle cx="12" cy="12" r="3.5" fill="#38BDF8" filter="url(#glow)" />
      <text x="23" y="15.5" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#38BDF8" letter-spacing="1.2">BUFFALO 0.9.0</text>
    </g>

    <!-- Main Title: ZYNTHEOR -->
    <g transform="translate(0, 118)" class="brand-title">
      <text x="0" y="0" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="url(#brand-grad)" letter-spacing="4">ZYNTHEOR</text>
    </g>

    <!-- Subtitle: AI ENGINE -->
    <text x="328" y="112" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#A3B3C6" letter-spacing="3.5">AI ENGINE</text>

    <!-- Subhead Slogan -->
    <text x="2" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#A3B3C6" letter-spacing="0.3">
      Local-first engineering intelligence workspace <tspan fill="#14B8A6">•</tspan> Model gateway <tspan fill="#14B8A6">•</tspan> Verifiable reasoning
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 178)">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="154" height="28" rx="8" fill="#111F32" stroke="#172A40" stroke-width="1" />
        <path d="M12 14 L16 10 L20 14 L16 18 Z" fill="#14B8A6" />
        <text x="27" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#2DD4BF">ZYNTHEOR CORE</text>
      </g>

      <g transform="translate(164, 0)">
        <rect x="0" y="0" width="160" height="28" rx="8" fill="#111F32" stroke="#172A40" stroke-width="1" />
        <circle cx="14" cy="14" r="3.5" fill="#10B981" />
        <text x="26" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#34D399">Local-Only Security</text>
      </g>

      <g transform="translate(334, 0)">
        <rect x="0" y="0" width="134" height="28" rx="8" fill="#111F32" stroke="#172A40" stroke-width="1" />
        <circle cx="14" cy="14" r="3.5" fill="#38BDF8" />
        <text x="26" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#38BDF8">Prompt Forge</text>
      </g>

      <g transform="translate(478, 0)">
        <rect x="0" y="0" width="124" height="28" rx="8" fill="#111F32" stroke="#172A40" stroke-width="1" />
        <circle cx="14" cy="14" r="3.5" fill="#38BDF8" />
        <text x="26" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#38BDF8">Streaming SSE</text>
      </g>
    </g>
  </g>

  <!-- Corner Accent Marks -->
  <g stroke="#14B8A6" stroke-width="1.8" opacity="0.6">
    <path d="M 16 28 L 16 16 L 28 16" fill="none" />
    <path d="M 864 28 L 864 16 L 852 16" fill="none" />
    <path d="M 16 232 L 16 244 L 28 244" fill="none" />
    <path d="M 864 232 L 864 244 L 852 244" fill="none" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 130" width="840" height="130" role="img" aria-label="ZYNTHEOR AI ENGINE Buffalo Edition Sovereign Footer">
  <defs>
    <linearGradient id="ftr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08101E" />
      <stop offset="50%" stop-color="#0B182B" />
      <stop offset="100%" stop-color="#07101C" />
    </linearGradient>

    <linearGradient id="ftr-laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>

    <linearGradient id="ftr-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <filter id="ftr-glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes ftr-stroke {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    .ftr-anim {
      stroke-dasharray: 40 160;
      animation: ftr-stroke 6s linear infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .ftr-anim { animation: none; }
    }
  </style>

  <!-- Card container -->
  <rect x="4" y="4" width="832" height="122" rx="16" fill="url(#ftr-bg)" stroke="#16324D" stroke-width="1.2" />

  <!-- Center Hexagon Seal -->
  <g transform="translate(420, 36)">
    <polygon points="0,-14 12,-7 12,7 0,14 -12,7 -12,-7" fill="#0C2036" stroke="#14B8A6" stroke-width="1.2" />
    <circle cx="0" cy="0" r="2.5" fill="#38BDF8" />
  </g>

  <!-- Titles -->
  <text x="420" y="66" text-anchor="middle" font-family="'Noto Sans Thai','Segoe UI',sans-serif" font-size="18" font-weight="800" letter-spacing="4" fill="url(#ftr-title)">ZYNTHEOR AI ENGINE</text>
  <text x="420" y="86" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10.5" font-weight="600" letter-spacing="2" fill="#2DD4BF">BUFFALO EDITION · SOVEREIGN LOCAL-FIRST INTELLIGENCE CORE</text>
  <text x="420" y="104" text-anchor="middle" font-family="'Noto Sans Thai','Segoe UI',sans-serif" font-size="9" letter-spacing="1" fill="#64748B">AGPL-3.0 · CRYPTOGRAPHIC GOVERNANCE BASELINE · ZERO-SIMULATION ASSURANCE</text>

  <!-- Animated Border Lasers -->
  <rect x="4" y="4" width="832" height="122" rx="16" fill="none" stroke="url(#ftr-laser)" stroke-width="2.2" stroke-linecap="round" pathLength="200" class="ftr-anim" filter="url(#ftr-glow)" />
</svg>

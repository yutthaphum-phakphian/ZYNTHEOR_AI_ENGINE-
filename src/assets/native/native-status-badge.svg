<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 110" width="360" height="110" role="img" aria-label="ZYNTHEOR CORE native status badge">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080F1B"/>
      <stop offset="55%" stop-color="#0D1828"/>
      <stop offset="100%" stop-color="#111F32"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="360" height="110" rx="16" fill="url(#bg)" stroke="rgba(148, 163, 184, 0.14)" stroke-width="1.5"/>
  <rect x="1.5" y="1.5" width="357" height="107" rx="14.5" fill="none" stroke="#172A40" stroke-width="1" opacity="0.8"/>
  <!-- status orb -->
  <circle cx="42" cy="55" r="22" fill="#0D1828" stroke="url(#amber)" stroke-width="2" filter="url(#glow)"/>
  <circle cx="42" cy="55" r="8" fill="#fbbf24"/>
  <circle cx="42" cy="55" r="3.5" fill="#fff7ed"/>
  <!-- text -->
  <text x="78" y="40" fill="#f8fafc" font-family="'Noto Sans Thai', 'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="0.02em">ZYNTHEOR CORE</text>
  <text x="78" y="62" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">MODEL_NOT_FOUND</text>
  <text x="78" y="82" fill="#A3B3C6" font-family="'Noto Sans Thai', system-ui, sans-serif" font-size="11">No trained weights · honest runtime probe</text>
  <text x="78" y="98" fill="#A3B3C6" font-family="'Noto Sans Thai', system-ui, sans-serif" font-size="10">Buffalo Edition 0.13.0</text>
  <!-- corner accent -->
  <path d="M330 18h18v18" fill="none" stroke="url(#teal)" stroke-width="2" stroke-linecap="round"/>
  <path d="M348 92h-18v-18" fill="none" stroke="url(#teal)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
</svg>

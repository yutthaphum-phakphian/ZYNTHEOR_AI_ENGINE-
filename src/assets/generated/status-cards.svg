<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 132" width="840" height="132" role="img" aria-labelledby="t d" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif">
  <title id="t">ZYNTHEOR AI ENGINE - Verified Status Cards</title>
  <desc id="d">TESTS: 151 PASSED; TYPE SAFETY: 0 ERRORS; BUILD: COMPILED OK; SOVEREIGN AUDIT: COURT READY (Δ0.00% Drift, 14,902 Seals). Verified Local System Status.</desc>

  <defs>
    <!-- Rainbow Gradient -->
    <linearGradient id="sc-rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1A53"/>
      <stop offset="20%" stop-color="#FF8A00"/>
      <stop offset="40%" stop-color="#FFDD00"/>
      <stop offset="60%" stop-color="#00F59B"/>
      <stop offset="80%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#B336FF"/>
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="sc-card-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1828"/>
      <stop offset="100%" stop-color="#06101D"/>
    </linearGradient>

    <!-- Rainbow Glow Filter -->
    <filter id="sc-rainbow-glow" filterUnits="userSpaceOnUse" x="-20" y="-20" width="880" height="170">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes sc-rainbow-run {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes sc-pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    .sc-dot {
      animation: sc-pulse 2.2s ease-in-out infinite;
    }
    .sc-rainbow-laser {
      stroke-dasharray: 18 82;
      animation: sc-rainbow-run 5s linear infinite;
    }
    .sc-rainbow-laser-fast {
      stroke-dasharray: 12 88;
      animation: sc-rainbow-run 3.6s linear infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .sc-dot, .sc-rainbow-laser, .sc-rainbow-laser-fast { animation: none; }
    }
  </style>

  <!-- Card 1: TESTS -->
  <g transform="translate(0, 0)">
    <rect x="2" y="2" width="194" height="92" rx="14" fill="url(#sc-card-bg)" stroke="#134E4A" stroke-width="1.4"/>
    <circle class="sc-dot" cx="20" cy="22" r="4.5" fill="#10B981"/>
    <text x="32" y="26" font-size="11.5" font-weight="700" letter-spacing="2" fill="#5EEAD4">TESTS (VITEST)</text>
    <text x="98" y="58" text-anchor="middle" font-size="22" font-weight="800" fill="#10B981">151 PASS</text>
    <text x="98" y="78" text-anchor="middle" font-size="10.5" font-weight="600" fill="#64748B">18 SUITES · ZERO FAIL</text>

    <!-- Running Rainbow Laser (เส้นรุ้งวิ่งรอบการ์ด) -->
    <rect x="2" y="2" width="194" height="92" rx="14" fill="none" stroke="url(#sc-rainbow)" stroke-width="2.6" stroke-linecap="round" pathLength="100" class="sc-rainbow-laser" style="animation-delay:0s" filter="url(#sc-rainbow-glow)"/>
    <rect x="2" y="2" width="194" height="92" rx="14" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" pathLength="100" class="sc-rainbow-laser-fast" style="animation-delay:-1.2s"/>
  </g>

  <!-- Card 2: TYPE SAFETY -->
  <g transform="translate(215, 0)">
    <rect x="2" y="2" width="194" height="92" rx="14" fill="url(#sc-card-bg)" stroke="#0E4E75" stroke-width="1.4"/>
    <circle class="sc-dot" cx="20" cy="22" r="4.5" fill="#38BDF8" style="animation-delay:-0.5s"/>
    <text x="32" y="26" font-size="11.5" font-weight="700" letter-spacing="2" fill="#7DD3FC">TYPE SAFETY</text>
    <text x="98" y="58" text-anchor="middle" font-size="22" font-weight="800" fill="#38BDF8">0 ERRORS</text>
    <text x="98" y="78" text-anchor="middle" font-size="10.5" font-weight="600" fill="#64748B">STRICT TS · 100% SOUND</text>

    <!-- Running Rainbow Laser -->
    <rect x="2" y="2" width="194" height="92" rx="14" fill="none" stroke="url(#sc-rainbow)" stroke-width="2.6" stroke-linecap="round" pathLength="100" class="sc-rainbow-laser" style="animation-delay:-1.25s" filter="url(#sc-rainbow-glow)"/>
    <rect x="2" y="2" width="194" height="92" rx="14" fill="none" stroke="#00F59B" stroke-width="1.2" stroke-linecap="round" pathLength="100" class="sc-rainbow-laser-fast" style="animation-delay:-2.4s"/>
  </g>

  <!-- Card 3: BUILD -->
  <g transform="translate(430, 0)">
    <rect x="2" y="2" width="194" height="92" rx="14" fill="url(#sc-card-bg)" stroke="#115E59" stroke-width="1.4"/>
    <circle class="sc-dot" cx="20" cy="22" r="4.5" fill="#2DD4BF" style="animation-delay:-1s"/>
    <text x="32" y="26" font-size="11.5" font-weight="700" letter-spacing="2" fill="#5EEAD4">PRODUCTION BUILD</text>
    <text x="98" y="58" text-anchor="middle" font-size="22" font-weight="800" fill="#2DD4BF">COMPILED OK</text>
    <text x="98" y="78" text-anchor="middle" font-size="10.5" font-weight="600" fill="#64748B">VITE 6 · REACT 19 SPA</text>

    <!-- Running Rainbow Laser -->
    <rect x="2" y="2" width="194" height="92" rx="14" fill="none" stroke="url(#sc-rainbow)" stroke-width="2.6" stroke-linecap="round" pathLength="100" class="sc-rainbow-laser" style="animation-delay:-2.5s" filter="url(#sc-rainbow-glow)"/>
    <rect x="2" y="2" width="194" height="92" rx="14" fill="none" stroke="#FFDD00" stroke-width="1.2" stroke-linecap="round" pathLength="100" class="sc-rainbow-laser-fast" style="animation-delay:-3.6s"/>
  </g>

  <!-- Card 4: SOVEREIGN AUDIT -->
  <g transform="translate(645, 0)">
    <rect x="2" y="2" width="194" height="92" rx="14" fill="url(#sc-card-bg)" stroke="#3B2667" stroke-width="1.4"/>
    <circle class="sc-dot" cx="20" cy="22" r="4.5" fill="#A78BFA" style="animation-delay:-1.5s"/>
    <text x="32" y="26" font-size="11.5" font-weight="700" letter-spacing="2" fill="#C4B5FD">SOVEREIGN AUDIT</text>
    <text x="98" y="58" text-anchor="middle" font-size="19" font-weight="800" fill="#A78BFA">COURT READY</text>
    <text x="98" y="78" text-anchor="middle" font-size="10.5" font-weight="600" fill="#64748B">Δ0.00% · 14,902 SEALS</text>

    <!-- Running Rainbow Laser -->
    <rect x="2" y="2" width="194" height="92" rx="14" fill="none" stroke="url(#sc-rainbow)" stroke-width="2.6" stroke-linecap="round" pathLength="100" class="sc-rainbow-laser" style="animation-delay:-3.75s" filter="url(#sc-rainbow-glow)"/>
    <rect x="2" y="2" width="194" height="92" rx="14" fill="none" stroke="#F43F5E" stroke-width="1.2" stroke-linecap="round" pathLength="100" class="sc-rainbow-laser-fast" style="animation-delay:-4.8s"/>
  </g>

  <!-- Verified Status Footer Line -->
  <text x="420" y="118" text-anchor="middle" font-size="11" font-weight="500" fill="#94A3B8">
    ZYNTHEOR AI ENGINE (Buffalo Edition v1.3.1 LTS) · Verified Live Snapshot · Cryptographic Forensic Admissibility
  </text>
</svg>
